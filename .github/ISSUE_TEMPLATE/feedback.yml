name: Feedback
description: Anything else — what was useful, what was missing, what you’d want next.
title: "[feedback] "
labels: ["feedback"]
body:
  - type: markdown
    attributes:
      value: |
        No structure required. Disagreement with the findings is welcome and is
        the most useful kind of feedback there is; if you think a reading is
        wrong, say so here.

  - type: textarea
    id: body
    attributes:
      label: Your feedback
      description: >-
        If you came looking for something specific and didn’t find it, that’s
        worth more than a compliment.
    validations:
      required: true

  - type: checkboxes
    id: audience
    attributes:
      label: Which of these fits you?
      description: Optional. It tells us who the report is actually reaching.
      options:
        - label: Design system designer
        - label: Design system engineer
        - label: I run agents against design systems
        - label: Researcher or analyst
        - label: None of the above

  - type: input
    id: page
    attributes:
      label: Which page is this about?
      description: Optional.
      placeholder: https://state-of-ai-in-design-systems.netlify.app/insights
    validations:
      required: false
