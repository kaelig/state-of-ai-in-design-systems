<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OG image</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900&display=block"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #fff;
      }
      .card {
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: 80px;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .label {
        font-weight: 600;
        font-size: 20px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #2563eb;
        margin: 0;
      }
      h1 {
        font-weight: 750;
        font-size: 110px;
        letter-spacing: -0.03em;
        line-height: 1.02;
        color: #111111;
        max-width: 15ch;
        margin: 30px 0 0;
      }
      .rule {
        width: 64px;
        height: 3px;
        background: #2563eb;
        margin: 36px 0 0;
      }
      .stats {
        font-weight: 400;
        font-size: 26px;
        color: #555555;
        margin: 28px 0 0;
      }
      .byline {
        font-size: 24px;
        color: #111111;
        font-weight: 600;
      }
      .byline span {
        color: #555555;
        font-weight: 400;
        margin-left: 16px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div>
        <p class="label">Field study &middot; July 2026</p>
        <h1>State of AI in Design Systems</h1>
        <div class="rule"></div>
        <p class="stats">
          19 systems &middot; 5 platforms &middot; 168 AI affordances &middot;
          148 coercion techniques
        </p>
      </div>
      <div class="byline">Kaelig Deloumeau-Prigent<span>kaelig.fr</span></div>
    </div>
  </body>
</html>
