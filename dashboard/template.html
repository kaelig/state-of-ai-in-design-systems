<style>
@font-face { font-family: 'Hanken Grotesk Fallback'; src: local('Arial'); size-adjust: 100%; ascent-override: 95%; }
@font-face { font-family: 'Source Sans Fallback'; src: local('system-ui'); size-adjust: 105%; ascent-override: 90%; }

:root {
  color-scheme: light dark;
  --bg: light-dark(#FFFFFF, #111111);
  --bg-raise: light-dark(#FFFFFF, #191919);
  --bg-sunk: light-dark(#F5F5F5, #0A0A0A);
  /* Row tracking, not striping. --row-hover is the wash under the row the pointer
     is on; --cell-hover sits one step deeper, for the one cell that is itself a
     link. Both are solid, not alpha: the sticky first column paints them over
     scrolled content, where a translucent wash would show the rows underneath. */
  --row-hover: light-dark(#F7F7F7, #1A1A1A);
  --cell-hover: light-dark(#ECECEC, #232323);
  --ink: light-dark(#111111, #E8E8E8);
  --ink-2: light-dark(#555555, #A6A6A6);
  --ink-3: light-dark(#6E6E6E, #919191);
  --line: light-dark(#E0E0E0, #2A2A2A);
  --line-strong: light-dark(#C9C9C9, #3D3D3D);
  /* Controls only. The hairlines around tiles, chips and table rows are decoration
     and stay on --line; a control's edge is what tells a low-vision reader where
     the filter box is, so it clears 3:1 against all three grounds — including
     --bg-sunk, which is the snippet copy button's ground (scripts/check_contrast.js). */
  --control-line: light-dark(#8A8A8A, #6B6B6B);
  --accent: light-dark(#2563EB, #5B9AFF);
  --accent-ink: light-dark(#1D4ED8, #7FB3FF);
  --accent-wash: light-dark(#EFF4FF, #17233D);
  /* Data tokens — deliberately unsaturated so they never read as calls to action.
     Intensity, not hue, carries importance. All pairs verified AA 4.5:1 (scripts/check_contrast.js). */
  --mat-0: light-dark(#F4F4F5, #1E1E20); --mat-0-ink: light-dark(#52525B, #A1A1AA);
  --mat-1: light-dark(#E2EAF2, #1F2C39); --mat-1-ink: light-dark(#3F5C77, #9FB9D0);
  --mat-2: light-dark(#CBDCEB, #27394C); --mat-2-ink: light-dark(#29465F, #BBD2E6);
  --mat-3: light-dark(#AECCE5, #32485E); --mat-3-ink: light-dark(#122C42, #D8E7F5);
  --data-strong: light-dark(#3D6491, #8FB4D9);
  --font-display: 'Hanken Grotesk', 'Hanken Grotesk Fallback', system-ui, sans-serif;
  --font-body: 'Source Sans 3', 'Source Sans Fallback', system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 3px;
  /* Two measures, no more: one for ledes, one for body prose. Tabular blocks
     (the matrix, metagrid) are not prose and stay full-width. */
  --measure-lede: 62ch;
  --measure-body: 74ch;
}
:root[data-theme="light"] { color-scheme: light; }
:root[data-theme="dark"] { color-scheme: dark; }

* { margin: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5; /* 24px — the scale and its leading sit on the 4px grid */
  background: var(--bg);
  color: var(--ink);
  /* No theme transition: only body could animate, so every hairline, wash and
     snippet ground flipped instantly around it. Instant everywhere is the only
     version that cannot look half-done. */
}
/* Kill the 300ms tap delay and the gray flash, on controls only. */
a, button, summary { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
a {
  color: var(--accent-ink);
  text-decoration: underline;
  text-decoration-color: transparent;
  text-underline-offset: 3px;
  text-decoration-thickness: 1.5px;
  transition: text-decoration-color .2s ease;
}
a:hover { text-decoration-color: currentColor; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
#main:focus { outline: none; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
}
.main a, .main p, .main li, .main summary { overflow-wrap: anywhere; }
code { font-family: var(--mono); font-size: .9em; background: var(--bg-sunk); border: 1px solid var(--line); border-radius: 2px; padding: 0 4px; overflow-wrap: anywhere; }
.snip pre code { background: none; border: none; padding: 0; }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--accent); color: #fff;
  font-family: var(--font-display); font-size: 13px; font-weight: 600;
  padding: 8px 16px; border-radius: var(--radius); text-decoration: none; z-index: 20;
}
.skip:focus { left: 12px; top: 12px; }

.theme-toggle {
  position: fixed; top: 16px; right: 16px; z-index: 10;
  width: 44px; height: 44px; border-radius: 50%;
  /* Opaque: it is fixed, and on narrow screens the column scrolls right underneath it. */
  border: 1px solid var(--control-line); background: var(--bg);
  color: var(--ink-2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: color .2s ease, border-color .2s ease;
}
.theme-toggle:hover { color: var(--accent-ink); border-color: var(--accent); }
.theme-toggle svg { width: 14px; height: 14px; display: block; }
.theme-toggle .i-sun { display: none; }
@media (prefers-color-scheme: dark) {
  .theme-toggle .i-moon { display: none; }
  .theme-toggle .i-sun { display: block; }
}
:root[data-theme="dark"] .theme-toggle .i-moon { display: none; }
:root[data-theme="dark"] .theme-toggle .i-sun { display: block; }
:root[data-theme="light"] .theme-toggle .i-moon { display: block; }
:root[data-theme="light"] .theme-toggle .i-sun { display: none; }

.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }
/* Flex column so the foot can sit at the bottom of the rail instead of wherever
   the nav happens to stop. */
.rail { border-right: 1px solid var(--line); padding: 24px 0 24px 20px; position: sticky; top: 0; align-self: start; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
/* The masthead is the way home. It is a whole block, not a run of text, so it
   drops the shared underline affordance and answers the pointer with ink. */
.rail-brand { display: block; padding-right: 16px; text-decoration: none; }
.rail-brand:hover strong { color: var(--accent-ink); }
/* Same type as the page eyebrow it sits beside: family, weight, size and
   tracking all match, so the two read as one line across the rule. The
   line-height is the one thing that cannot match. The page eyebrow is centered
   in a flex row against a taller download button, which lands it 1.45px above
   the rail's padding edge, and this 13.61px box is what pulls the rail's copy
   down onto it. Tuned against that button: if it changes height, retune here. */
.rail-brand .k {
  display: block; font-family: var(--font-display); font-weight: 550; font-size: 11px;
  line-height: 13.61px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
.rail-brand strong {
  display: block; margin-top: 5px; font-family: var(--font-display); font-weight: 700;
  font-size: 16px; line-height: 1.25; letter-spacing: -.02em; color: var(--ink);
  transition: color .2s ease;
}
.navwrap { position: relative; }
.rail nav { display: flex; flex-direction: column; gap: 2px; margin-top: 26px; margin-left: -20px; }
.rail nav a {
  font-family: var(--font-display); font-weight: 550; font-size: 12px;
  letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2);
  text-decoration: none; display: flex; align-items: center; gap: 10px;
  min-height: 44px; padding: 0 12px 0 20px; border-right: 2px solid transparent;
}
/* Stroked in currentColor, so the hover and current-page rules below tint the
   glyph along with its label and there is no icon color to keep in sync.
   flex-shrink is off because the narrow layout turns this into a scrolling row,
   where a squashed glyph is the first thing to give. */
.rail nav a svg { width: 16px; height: 16px; flex: none; }
/* Optical corrections, keyed on data-r so the Feather paths stay verbatim and a
   future glyph swap is still a one-line diff in NAV_ICON_PATHS.
   Every icon is drawn to the same 24px box and centers geometrically, which is
   not the same as centring by weight: the house and the clipboard both hang a
   heavy horizontal along the bottom and taper to a roof point or a small tab at
   the top, so the ink reads low in a box that measures centered. The server is
   two full-width rounded rectangles — roughly twice the stroke length of any
   other glyph in the row, so at a shared width it reads as the darker one.
   Nudge the first two up; thin the third rather than shrink it, so the row
   keeps one icon size. */
.rail nav a[data-r="overview"] svg,
.rail nav a[data-r="methodology"] svg { transform: translateY(-1px); }
.rail nav a[data-r="platforms"] svg { stroke-width: 1.75; }
.rail nav a:hover { color: var(--ink); background: var(--bg-sunk); }
.rail nav a.on, .rail nav a[aria-current="page"] { color: var(--accent-ink); border-right-color: var(--accent); background: var(--accent-wash); }
.rail-foot { margin-top: auto; padding: 28px 16px 0 0; font-size: 13px; color: var(--ink-3); }

/* Not the rail's 24px. The row this column opens with centers its eyebrow
   against a taller download button, so the text lands a few pixels below the
   padding edge. 18px is what puts that eyebrow on the same line as "Field
   study" across the rule. */
.main { padding: 18px 40px 40px; max-width: 1120px; min-width: 0; }
.view { display: none; }
.view.on { display: block; }

.accent-rule { border: none; height: 3px; width: 4rem; background: var(--accent); margin: 20px 0 24px; }

.eyebrow, .label, .metagrid .k, .twocol .col .t, table.mx thead th,
table.mx tr.mx-group th {
  font-family: var(--font-display); font-weight: 550; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
}
.eyebrow { color: var(--accent-ink); }
h1 { font-family: var(--font-display); font-size: clamp(28px, calc(24px + 1.4vw), 40px); font-weight: 650; letter-spacing: -.03em; line-height: 1.1; margin: 8px 0 12px; text-wrap: balance; }
.lede { font-size: 18px; color: var(--ink-2); max-width: var(--measure-lede); }
.byline { font-size: 13px; color: var(--ink-3); margin-top: 8px; }
h2 { font-family: var(--font-display); font-size: 20px; font-weight: 650; letter-spacing: -.015em; margin: 38px 0 6px; }
/* Scoped to a view's own genuinely-first heading. Unscoped, this fired on every
   h2 that opens a <section> wrapper — on /ai each section's h2 is a first child,
   so every one of them lost its 38px and sat on the block above it. Card headings
   (.tech-cat, .plat) set their own margin and are unaffected either way. */
.view > h2:first-child { margin-top: 0; }
.h2-sub { color: var(--ink-2); font-size: 14px; margin-bottom: 14px; max-width: var(--measure-body); }
/* Primary content that happens to sit under an h2, as opposed to a subtitle for
   it. .h2-sub is chrome; this is prose. */
.body-block { font-size: 14px; color: var(--ink); max-width: var(--measure-body); margin: 0 0 8px; text-wrap: pretty; }
.body-block.gaps { color: var(--ink); }
/* Per-platform verdicts on a system page: a heading in the outline, but sized to
   the paragraph it opens rather than to the section h3s above it. */
.pi { font-size: 14px; margin: 14px 0 2px; }
h3 { font-family: var(--font-display); font-size: 16px; font-weight: 650; letter-spacing: -.015em; margin: 22px 0 8px; }
/* One count treatment, everywhere a number sits beside a heading or a label:
   body sans, tabular, --ink-3. Same family as the matrix cohort counts. */
.hcount { font-family: var(--font-body); font-weight: 400; font-size: 14px; letter-spacing: normal; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 26px 0; list-style: none; padding: 0; }
/* Column + margin-top:auto: the third line sits on one baseline across all five
   tiles however many lines the label above it takes. */
.tile { background: var(--bg-raise); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; position: relative; }
/* One anchor over the numeral and the label, stretched to the tile's edges: the
   accessible name stays "20 design systems studied" while the whole card is the
   target. Tiles sit on --bg-raise, so a row-hover background shift has nowhere
   to go and the border and the label carry the hover instead. The numeral keeps
   --ink: blue is for interaction, and the numeral is data. */
.tile > a { color: inherit; text-decoration: none; }
.tile > a::after { content: ""; position: absolute; inset: 0; }
.tile:hover { border-color: var(--line-strong); }
.tile:hover .l { color: var(--accent-ink); }
/* The ring traces the tile, not the two lines of text inside it. Without the
   override the global :focus-visible rule boxes the anchor at +3px and spills
   over the tile's own border. */
.tile:has(a:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }
.tile > a:focus-visible { outline: none; }
.tile .n { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; font-variant-numeric: lining-nums tabular-nums; }
.tile .l { font-size: 13px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }
/* Prose stopped wearing mono here: only the tile that quotes an actual command
   keeps a monospace run, and it does it with <code>. */
.tile .d { font-size: 12px; color: var(--ink-3); margin-top: auto; padding-top: 6px; font-variant-numeric: tabular-nums; }
/* The detail line is a standalone chip, not a run inside a sentence, so it can
   afford the vertical padding that inline <code> in prose cannot. */
.tile .d code { padding: 2px 7px; }

/* Pill tags. Rounded on purpose: pills read as metadata, squares stay for buttons and inputs. */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-display); font-weight: 600; font-size: 10px;
  letter-spacing: .04em; text-transform: uppercase;
  padding: 2.5px 8px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--ink-3); white-space: nowrap;
}
.chip.mat-none { background: var(--mat-0); color: var(--mat-0-ink); border-color: transparent; }
.chip.mat-emerging { background: var(--mat-1); color: var(--mat-1-ink); border-color: transparent; }
.chip.mat-invested { background: var(--mat-2); color: var(--mat-2-ink); border-color: transparent; }
.chip.mat-ai-native { background: var(--mat-3); color: var(--mat-3-ink); border-color: transparent; }
.chip.official { background: var(--mat-1); color: var(--mat-1-ink); border-color: transparent; }

/* Pill rows for the jump lists that /ai, /platforms, /reading and /insights
   all build through jumpList(). */
.jump li a { font-size: 13px; border: 1px solid var(--line); background: var(--bg); border-radius: 2px; padding: 2px 8px; color: var(--ink); display: inline-block; text-decoration: none; }
.jump li a:hover { border-color: var(--accent); color: var(--accent-ink); }
.jump { list-style: none; padding: 0; margin: 22px 0 20px; display: flex; flex-wrap: wrap; gap: 6px; }
/* The accent rule already leaves 24px under itself, so a list that follows one
   needs no gap of its own. A list that follows prose, as /ai's does, needs it. */
.accent-rule + .jump { margin-top: 0; }

/* font-size here only so `ch` resolves against the body text it caps: the
   hairline then ends exactly where the paragraph does, past the 48px numeral
   gutter. Title and numeral set their own sizes. */
.findings { counter-reset: f; list-style: none; padding: 0; margin: 14px 0 0; font-size: 14px; max-width: calc(var(--measure-body) + 48px); }
.findings li { counter-increment: f; position: relative; border-top: 1px solid var(--line); padding: 14px 0 14px 48px; }
.findings li:last-child { border-bottom: 1px solid var(--line); }
.findings li::before { content: counter(f, decimal-leading-zero) / ""; position: absolute; left: 0; top: 14px; font-family: var(--font-display); font-weight: 600; font-size: 16px; color: var(--accent-ink); font-variant-numeric: lining-nums tabular-nums; }
.findings h3 { display: block; margin: 0 0 3px; font-family: var(--font-display); font-weight: 650; font-size: 16px; letter-spacing: -.01em; }
.findings p { color: var(--ink); font-size: 14px; max-width: var(--measure-body); }

/* No frame and no fills: the table is built out of hairlines, alignment and one
   data ink. Every horizontal wash the old grid used — the zebra, the sunk header
   slab, the cohort bands — is gone, because three stacked fill systems were
   drawing the structure that 1px of --line can draw on its own.
   border-collapse is separate, not collapse: a collapsed border belongs to the
   table, not to the cell, so it stays behind while a sticky row or column slides
   away from it. Each edge is declared in one direction only (rows carry
   border-bottom, the frozen column carries border-right), so nothing doubles. */
.scroller { position: relative; overflow-x: auto; }
.scroller:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
table.mx { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 12px; }
table.mx th, table.mx td { padding: 8px 6px; text-align: center; }
/* nowrap belongs to the data cells only: on the header row it was forcing
   "Repo agent files" onto one line and pushing the table past its column. */
table.mx td { white-space: nowrap; }
/* The header is a line of labels over a rule, not a slab. --bg is a paint job,
   not a fill: the row is sticky and has to be opaque, so it paints the page's own
   ground and the rule underneath is the only mark it makes. */
table.mx thead th {
  background: var(--bg); position: sticky; top: 0; z-index: 3;
  white-space: normal; line-height: 1.15; vertical-align: bottom;
  padding-bottom: 10px; color: var(--ink-2); font-weight: 600;
  border-bottom: 1px solid var(--line-strong);
}
/* Sticky cells can't be transparent — they ride over scrolled content — so
   each paints its row's own ground explicitly. The right hairline is what says
   the column is frozen; it travels with the cell because borders are separate. */
table.mx th.sys, table.mx td.sys {
  text-align: left; position: sticky; left: 0;
  background: var(--bg); min-width: 130px;
  border-right: 1px solid var(--line);
}
/* Corner cell: above the frozen column and inside the sticky header, so it has
   to outrank both. */
table.mx thead th.sys { z-index: 4; }
table.mx tbody th.sys { z-index: 1; }
/* One hairline per row is the whole tracking system. The last row of a cohort
   drops its line, because the cohort seam above the next group header closes the
   block; the last row of the table closes on the stronger of the two weights, so
   the grid ends on the same rule it started on. */
table.mx tbody th.sys, table.mx tbody td { border-bottom: 1px solid var(--line); }
table.mx tbody tr:last-child th.sys, table.mx tbody tr:last-child td { border-bottom: none; }
table.mx tbody:last-of-type tr:last-child th.sys,
table.mx tbody:last-of-type tr:last-child td { border-bottom: 1px solid var(--line-strong); }
/* The system name wears the systems-list row voice — display face, ink, wash on
   hover, accent name — scaled to table density. The anchor fills the cell. */
table.mx tbody th.sys { padding: 0; font-size: 12px; }
table.mx tbody th.sys a { display: block; padding: 8px 6px; font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; color: var(--ink); text-decoration: none; }
/* Room for the longest name on one line; on phones the sticky column would eat
   the screen at that width, so names wrap there instead. */
@media (min-width: 861px) { table.mx tbody th.sys a { white-space: nowrap; } }
table.mx tbody th.sys a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Reading a 12-column row is the thing this table asks of people, so the row the
   pointer is on lights faintly — tracking, not an affordance. The cell that is
   actually a link lights one step deeper, so "where am I" and "what would I
   click" stay two different signals instead of one ambiguous one. */
table.mx tbody tr:hover th.sys, table.mx tbody tr:hover td { background: var(--row-hover); }
table.mx tbody th.sys a:hover { background: var(--cell-hover); color: var(--accent-ink); }
/* A filled cell links to the affordance's own artifact; the anchor fills the cell
   so the target is the cell, not the 10px glyph. */
table.mx td.cl { padding: 0; }
table.mx td.cl a { display: block; padding: 8px 6px; }
table.mx td.cl a:hover { background: var(--cell-hover); }
table.mx td.cl a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* Official and community share one footprint and differ only in fill, so the
   column reads as one rhythm of 10px marks and the eye compares density down a
   column instead of size. box-sizing: border-box makes the ring's stroke sit
   inside that footprint rather than adding to it. */
table.mx td .dot, table.mx td .ring,
.mx-legend .dot, .mx-legend .ring {
  display: inline-block; width: 10px; height: 10px; border-radius: 50%;
  vertical-align: -1px;
}
table.mx td .dot, .mx-legend .dot { background: var(--data-strong); }
table.mx td .ring, .mx-legend .ring { border: 2px solid var(--data-strong); }
/* "None found" is one of three states in the grid, so it has to be visible — and
   it has to stay quieter than the two states that mean something is there.
   A 1px dash was the wrong shape for that job: a horizontal mark is directional,
   so twenty of them down a sparse column snapped into a dotted vertical ladder
   and read as a column rule, and it echoed the row hairlines besides. A disc is
   isotropic — repeated, it makes texture rather than a line. At 4px it carries
   12.6px² of ink against the dot's 78.5, so absence can no longer out-weigh
   presence in a column, and it is far enough below the 10px marks to be a
   different class of object rather than a smaller version of one. Same object in
   the legend, so cell and key are literally the same 4px. */
table.mx td .none, .mx-legend .none-key {
  display: inline-block; width: 4px; height: 4px; border-radius: 50%;
  background: var(--ink-3); vertical-align: 2px;
}
/* Cohort break. No band: a rule across the full scroll width, then air, then the
   cohort's name — the same way a section break works in the prose on this site.
   The seam is --line-strong so it outranks the row hairlines it separates, and
   the air is what actually groups the rows. The seam sits inside the cell
   because a table cell cannot hold margin above its own border.
   20px, not 26: a break taller than the 34px row it separates stops reading as a
   seam inside one table and starts reading as the gap between three of them. At
   20 the break is under two-thirds of a row, so the cohorts stay sections of a
   single grid across a 20-row scroll, and the label still has more air above it
   than the 8px below, which is what keeps it attached to the rows it opens. */
table.mx tr.mx-group th {
  position: static; text-align: left;
  padding: 20px 6px 8px;
  border-top: 1px solid var(--line-strong);
  /* The label voice comes from the shared rule above; only the color steps up
     to --ink. Metadata, not a control: no hover, no pointer. */
  color: var(--ink);
}
/* The first cohort opens directly under the header's rule, so it brings no seam
   of its own and sits closer. */
table.mx tbody:first-of-type tr.mx-group th { border-top: none; padding-top: 12px; }
/* The label rides sticky so the cohort name stays readable however far the table
   is scrolled. Nothing sits behind it — the group row is a rule and empty space —
   so it needs no ground of its own.
   A sticky child inside a static cell paints in DOM order, which put the cohort
   label — the last thing in the document — on top of the sticky header as it
   scrolled past. z-index: 0 gives it a stacking level the header's 3 can beat. */
table.mx tr.mx-group th .gl {
  position: sticky; left: 6px; z-index: 0;
  display: inline-flex; align-items: center; gap: 8px;
}
/* Maturity is ordinal, so it is counted, not colored: four rungs, the first N
   filled, N being the level's rank up the scale. A count carries its own
   denominator — "two of four" — where a wash only says "lighter than the one
   above", and it survives both themes on a single ink.
   The unfilled rungs are the scale's track and take --line-strong, the site's
   hairline weight, instead of the .45 opacity the SVG attribute carries. On a
   plain page ground .45 would have faded to about 1.9:1; --line-strong keeps
   filled and unfilled 3.7:1 apart in light and 5.0:1 in dark, so the count can
   be read exactly, while the filled rungs clear 3:1 on the page (6.1:1 / 8.7:1).
   Tinting it per cohort with --mat-N-ink was tried and rejected. It clears
   contrast everywhere — the worst pair is 4.22:1 against the track — but those
   inks were mixed to sit on their own wash, not on the page, so on --bg the ramp
   stops being a ramp: 'none' lands at 7.73:1 and 'emerging', the level above it,
   at 6.98:1. An ordinal scale whose second step is lighter than its first is a
   chart that lies. It also puts AI-native at 14.34:1 — more than twice the
   weight of the data marks it introduces — so the band that lacked subtlety
   returns as a very small, very dark object. And against --data-strong the four
   tints separate by 1.06 to 2.34:1, so beside the dots the color the reader is
   supposed to recognize is not resolvable anyway. The count is the encoding; the
   tint would have cost the table's single data ink to add a channel that is
   either invisible or wrong. */
table.mx tr.mx-group .rungs { width: 16px; height: 16px; flex: none; }
table.mx tr.mx-group .rungs line { stroke: var(--data-strong); }
table.mx tr.mx-group .rungs line[opacity] { stroke: var(--line-strong); opacity: 1; }
/* The cohort's own count steps back to --ink-3 and drops the tracking that the
   label needs and a numeral does not: the section's tally is quieter than the
   data it introduces. */
table.mx tr.mx-group th .gn {
  font-family: var(--font-body); font-weight: 600; font-size: 12px;
  letter-spacing: normal; text-transform: none;
  font-variant-numeric: tabular-nums; color: var(--ink-3);
}
/* Forced colors drops author backgrounds and borders, which would have taken the
   dot, the ring, the "none" rule and the rungs with them — the entire table,
   since every cell's content is one of those four marks. Re-stated in system
   colors: the data marks are CanvasText, the two that mean "nothing here" and
   "not reached on the scale" are GrayText, so the three cell states and the rung
   count all survive. */
@media (forced-colors: active) {
  table.mx td .dot, .mx-legend .dot { background: CanvasText; }
  table.mx td .ring, .mx-legend .ring { border-color: CanvasText; }
  table.mx td .none, .mx-legend .none-key { background: GrayText; }
  table.mx tr.mx-group .rungs line { stroke: CanvasText; }
  table.mx tr.mx-group .rungs line[opacity] { stroke: GrayText; }
}
/* Edge fades belong to the wrapper, not the scroller: inside it they would
   scroll away with the content. They only exist while the table can scroll. */
.mxwrap { position: relative; }
.mxwrap .fade { position: absolute; top: 0; bottom: 0; width: 28px; pointer-events: none; opacity: 0; }
.mxwrap .fade-l { left: 1px; background: linear-gradient(to right, var(--bg), transparent); }
.mxwrap .fade-r { right: 1px; background: linear-gradient(to left, var(--bg), transparent); }
.mxwrap[data-at-start="false"] .fade-l { opacity: 1; }
.mxwrap[data-at-end="false"] .fade-r { opacity: 1; }
/* The table fits the content column here, so the scroller stops being a scroll
   context and the sticky header finally resolves against the viewport. */
@media (min-width: 1060px) {
  .scroller { overflow: visible; }
  .mxwrap .fade { display: none; }
}
/* The key reads as one line of specimens rather than three floating pairs: each
   glyph sits in a fixed 14px track so the three labels start on the same rhythm,
   and the whole line is 12px --ink-2, the header row's voice, because it is
   documentation of the table and not part of it. */
.mx-legend { display: flex; gap: 20px; align-items: center; font-size: 12px; color: var(--ink-2); margin: 10px 2px 20px; flex-wrap: wrap; }
.mx-legend > span { display: inline-flex; align-items: center; gap: 7px; }
.mx-legend .dot, .mx-legend .ring, .mx-legend .none-key { flex: none; }

.jump li a:active { background: var(--bg-sunk); }

.backlink { font-family: var(--mono); font-size: 12px; text-decoration: none; display: inline-flex; align-items: center; gap: 7px; margin-bottom: 6px; }
/* 14px against 12px mono, not the rail's 16: this arrow sits beside lowercase
   text rather than an uppercase label, so it is measured against the x-height
   next to it. flex: none for the same reason the rail glyphs set it — a
   squashed arrow is what a tight line gives up first. */
.backlink svg { width: 14px; height: 14px; flex: none; }
/* A record summary runs to a paragraph or more. That is body copy, not a lede. */
.detail-sum { font-size: 16px; color: var(--ink); max-width: var(--measure-body); text-wrap: pretty; }
.backlink:hover { color: var(--accent); }
/* Centered, not baselined: the chip is a small bordered box, so its text sits
   far below its own middle. Put that baseline on the h1's and the chip hangs
   under the title. Aligning the boxes is what reads as level here. */
.dhead { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 10px; }
.dhead h1 { margin: 0; }
/* The page's meta line: eyebrow at the left, the markdown download hard right,
   the two sitting on one baseline. It rides here rather than on the title row
   because a long title and a button competed for the same width, and below
   about 1300px the button was the one that lost. Eyebrows are two or three
   words, so nothing competes. */
/* The gutter keeps the download clear of the theme toggle, which is fixed to the
   viewport's top-right and is the one thing that reaches as high as this row.
   The toggle owns the last 60px of the viewport (16 + 44) and wants 12 beyond
   that; the column already gives up 40 to .main's padding, and once the viewport
   passes 1344px (the 224px rail plus .main's 1120px cap) the slack on the right
   covers the rest. So the row asks for whatever those two do not already supply,
   which is nothing at all on a wide screen: no breakpoint to land wrong, and the
   download lines up with the content edge everywhere it can. */
.pagetop {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 6px 16px; flex-wrap: wrap;
  padding-right: max(0px, 32px - max(0px, 100vw - 1344px));
}
/* Small enough to belong to an 11px eyebrow rather than to the title under it,
   and bordered rather than filled: blue is for interaction here, so it arrives
   on hover and focus instead of sitting on the page as a call to action. */
.md-dl {
  margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 11px; color: var(--ink-2);
  border: 1px solid var(--line); border-radius: 5px; padding: 3px 8px;
  text-decoration: none; white-space: nowrap; position: relative;
}
.md-dl:hover { color: var(--accent-ink); border-color: var(--accent); }
.md-dl .mdi { width: 14px; height: auto; flex: none; }
/* Same record, machine-readable. Quiet on purpose: this is a footnote for the
   few readers who want the file, not a call to action. Path-routed builds only —
   the artifact has no mirrors to point at. */
.links.dlinks { margin: 6px 0 10px; font-size: 11px; gap: 14px; }
.links.dlinks a { color: var(--ink-3); text-decoration: underline; text-decoration-color: transparent; }
.links.dlinks a:hover { color: var(--accent-ink); text-decoration-color: currentColor; }
/* Separators are drawn on the cells, not by a background showing through a 1px
   gap: with auto-fit columns an unfilled last row turned that background into a
   solid gray slab at every width where the grid didn't divide evenly. */
/* The frame is an inset outline, not a border. A border sits outside the cells,
   so at the perimeter it stacked against the inward half of each cell's outline
   and drew 1.5px where the interior seams drew 1px. An outline pulled a full
   width inward lands in the band the cells already occupy, so every line in the
   grid is the same weight. It has to be an outline and not an inset box-shadow:
   outlines paint after descendants, shadows paint under them, and the cells have
   opaque backgrounds. */
.metagrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 0; background: var(--bg-raise); outline: 1px solid var(--line); outline-offset: -1px; border-radius: var(--radius); overflow: hidden; margin: 18px 0; }
.metagrid > div { background: var(--bg-raise); padding: 11px 14px; outline: 1px solid var(--line); outline-offset: -0.5px; }
.metagrid > .wide { grid-column: 1 / -1; }
.metagrid .k { font-size: 10px; letter-spacing: .12em; color: var(--ink-3); }
/* The UA stylesheet indents dd by 40px; the grid cell is the layout. */
.metagrid dd { margin: 0; }
.metagrid .v { font-size: 13px; margin-top: 2px; overflow-wrap: anywhere; }
.twocol { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.twocol .col { background: var(--bg-raise); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
/* Non-interactive section label: stays neutral so blue keeps meaning "you can act on this".
   It is an h2 in the outline, so the margin has to be reset here — the global h2's
   38px top margin would otherwise open a gap inside the card, above its own title. */
.twocol .col .t { font-size: 11px; letter-spacing: .12em; color: var(--ink-2); margin: 0 0 6px; }
.twocol .col p { font-size: 14px; color: var(--ink); }

/* A run of disclosures is a list: ten of them announce as ten items, not as ten
   unrelated widgets. The count in the h2 says the total once; this says where you are. */
.afflist, .exlist { list-style: none; padding: 0; margin: 0; }
.aff { border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-raise); margin-bottom: 10px; overflow: hidden; }
.aff > summary { list-style: none; cursor: pointer; padding: 12px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.aff > summary::-webkit-details-marker { display: none; }
.aff > summary::before { content: "+" / ""; font-family: var(--mono); color: var(--ink-3); width: 14px; }
.aff[open] > summary::before { content: "–" / ""; }
.aff > summary:hover { background: var(--bg-sunk); }
.aff > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.aff .nm { font-family: var(--font-display); font-weight: 650; font-size: 14px; letter-spacing: -.01em; }
.aff-body { padding: 2px 16px 16px 40px; }
.aff-body p.desc { font-size: 14px; color: var(--ink); max-width: var(--measure-body); }
.links { display: flex; gap: 16px; flex-wrap: wrap; margin: 10px 0 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.aff-body .note { font-size: 13px; color: var(--ink-3); margin-top: 8px; max-width: var(--measure-body); }
.snip { margin-top: 12px; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--bg-sunk); }
.snip-bar { display: flex; justify-content: space-between; align-items: center; gap: 4px 12px; flex-wrap: wrap; padding: 5px 10px 5px 12px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
.snip-bar .sbleft { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 10px; flex: 1 1 auto; min-width: 0; }
.snip-bar .lang { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; }
/* Where the quoted file actually lives when the source URL can only name the
   package (npm tarballs). Wraps instead of squeezing the actions. */
.snip-bar .snote { font-size: 10px; color: var(--ink-2); overflow-wrap: anywhere; }
/* Never let the note or a long language name crush the source link. */
.snip-bar .acts { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }
.snip-bar a { font-size: 11px; text-decoration: none; position: relative; }
.snip-bar a:hover { color: var(--accent); }
/* Same trick as the copy button: the link draws at 10.5px and takes taps across
   the full height of the bar. Vertical only, so the button beside it keeps its own. */
.snip-bar a::after { content: ""; position: absolute; inset: -12px 0; }
.snip-bar button { font: inherit; font-family: var(--mono); font-size: 11px; color: var(--ink); background: none; border: 1px solid var(--control-line); border-radius: var(--radius); padding: 5px 9px; cursor: pointer; position: relative; }
/* Invisible hit area, not visible height: the button draws at ~29px and takes
   taps across ~43px, at every viewport. Vertical only — the width is the button's,
   so the source link beside it can never lose a tap to it. Measured, not assumed:
   at -6px the real hit span came out ~38px, under the 40px floor. */
.snip-bar button::after { content: ""; position: absolute; inset: -8px 0; }
.snip-bar button:hover { color: var(--accent-ink); border-color: var(--accent); }
.snip pre { overflow-x: auto; padding: 12px 14px; font-family: var(--mono); font-size: 12px; line-height: 1.5; tab-size: 2; }
.snip pre:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* Cards that hold .tech-ex rows carry no vertical padding of their own — each
   child states its own inline inset through --card-pad, and the rows are full
   width by construction, hover and hairlines running edge to edge, the .aff
   way. Without a header, the first row sits flush on the card's own top
   border, so its border-top is dropped below: the card's border already
   draws that line, and stacking the two produced a visible 2px edge. With a
   header, .th carries its own top margin instead, since there's no row
   border there to double up against. overflow: hidden clips the first and
   last row's square corners to the card's own radius, the same as .aff — with
   the rows now flush to all four edges, the row's hover wash and the open
   .tb background would otherwise square off past the rounded corner. */
.tech-cat { --card-pad: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-raise); margin-bottom: 12px; overflow: hidden; }
.tech-cat > .th { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 16px var(--card-pad) 0; }
/* h2 keeps the one h2 size (19px) it has everywhere else; h3 stays a step down. */
.tech-cat > .th h2 { margin: 0; }
.tech-cat > .th h3 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 650; letter-spacing: -.015em; }
.tech-cat > .th .n { font-family: var(--font-body); font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tech-cat > .def { font-size: 13px; color: var(--ink-2); margin: 6px var(--card-pad) 10px; max-width: var(--measure-body); }
.tech-cat .exlist > li:first-child > .tech-ex { border-top: none; }
.tech-ex { border-top: 1px solid var(--line); }
.tech-ex > summary { list-style: none; cursor: pointer; padding: 11px var(--card-pad, 2px); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 13px; }
.tech-ex > summary::-webkit-details-marker { display: none; }
/* Same affordance cue as .aff: one marker, and background as the only hover
   signal. The old text recolor used the interactive blue on something that is
   not a link, and doubled a signal the background already carries. */
.tech-ex > summary::before { content: "+" / ""; font-family: var(--mono); color: var(--ink-3); width: 14px; flex: none; }
.tech-ex[open] > summary::before { content: "–" / ""; }
.tech-ex > summary:hover { background: var(--bg-sunk); }
.tech-ex > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.tech-ex .sysref { font-family: var(--font-display); font-weight: 600; font-size: 12px; /* Data attribution, not a link: the steel data color, never the interactive blue. */
  letter-spacing: .02em; color: var(--data-strong); min-width: 110px; }
/* summary inset + 14px marker + 10px gap: the body starts under the title. */
.tech-ex .tb { padding: 0 var(--card-pad, 2px) 14px calc(var(--card-pad, 2px) + 24px); }
.tech-ex .tb p { font-size: 13px; color: var(--ink); max-width: var(--measure-body); }

/* 28px below: the bars are a block of their own, not part of the first card. */
.bars { margin: 14px 0 28px; display: grid; gap: 6px; list-style: none; padding: 0; }
.bar-row, .bar-link { display: grid; grid-template-columns: 170px 1fr 46px; gap: 10px; align-items: center; font-size: 13px; }
/* On /techniques the row is the link to its own section below. The grid moves to
   the <a>, so the li is only a container. */
.bar-row:has(> .bar-link) { display: block; }
/* No resting affordance: the row looks exactly as it does when it is not a link.
   Hover is the site's row language — the sunk ground, and the label steps up to
   full ink. The global focus-visible ring does the keyboard half. */
.bar-link { color: inherit; text-decoration: none; border-radius: 2px; }
.bar-link:hover { background: var(--bg-sunk); }
.bar-link:hover .bl { color: var(--ink); }
.bar-row .bl { color: var(--ink-2); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-row .btrack { height: 16px; border-radius: 2px; background: var(--bg-sunk); position: relative; }
.bar-row .bfill { position: absolute; inset: 0 auto 0 0; border-radius: 2px; background: var(--data-strong); min-width: 2px; }
.bar-row .bv { font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

/* Same construction as .tech-cat: vertical card padding, children own their
   inline inset, capability rows run edge to edge. */
.plat { --card-pad: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg-raise); padding: 18px 0; margin-bottom: 14px; }
.plat h2 { margin: 0 var(--card-pad) 6px; }
/* A card-internal section label that is still a heading in the outline. */
.plat h3.caps {
  font-family: var(--font-display); font-weight: 550; font-size: 11px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2);
  margin: 18px var(--card-pad) 4px;
}
.plat .sum { font-size: 14px; color: var(--ink); max-width: var(--measure-body); margin-inline: var(--card-pad); text-wrap: pretty; }
.plat > .dlinks { margin-inline: var(--card-pad); }
.plat .adopt { font-size: 13px; color: var(--ink-2); margin-top: 10px; margin-inline: var(--card-pad); max-width: var(--measure-body); border-left: 2px solid var(--line-strong); padding-left: 12px; }

/* Sources as a hairline list, the .findings device without the numerals. Host
   recedes, path carries the meaning, nothing is truncated. */
.srclist { list-style: none; padding: 0; margin: 14px 0 0; max-width: var(--measure-body); }
.srclist li { border-top: 1px solid var(--line); padding: 10px 0; }
.srclist li:last-child { border-bottom: 1px solid var(--line); }
.srclist a { font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
.srclist .h { color: var(--ink-3); }
.srclist .p { color: var(--ink); }
.srclist a:hover .h, .srclist a:hover .p { color: var(--accent-ink); }
/* Sits under the sources, after the reader has seen what the record claims and
   what it claims it from. The srclist already closes on a hairline, so no rule. */
/* The correction invitation is the one call to action a record carries, so it
   gets the accent and a box of its own — a footnote in ink-3 got no replies. */
.correct { margin-top: 28px; padding: 14px 16px; border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: var(--radius); background: var(--bg-raise); max-width: var(--measure-body); }
.correct .t { font-family: var(--font-display); font-weight: 650; font-size: 16px; margin: 0 0 4px; }
.correct p { font-size: 14px; color: var(--ink-2); margin: 0 0 12px; }
.correct a { display: inline-block; border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--accent-ink); text-decoration: none; }
.correct a:hover { background: var(--accent); color: var(--bg); }
.correct a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* One entry per work. Wider than .ai-links because an entry carries a
   paragraph and sometimes a quotation, not a one-line note. */
.readlist { list-style: none; padding: 0; margin: 14px 0 30px; max-width: var(--measure-body); }
.readlist li { border-top: 1px solid var(--line); padding: 14px 0; }
.readlist li:last-child { border-bottom: 1px solid var(--line); }
.readlist .t { font-size: 16px; font-family: var(--font-display); }
.readlist .by { display: block; margin-top: 2px; font-size: 13px; color: var(--ink-3); }
.readlist p { margin: 8px 0 0; font-size: 15px; color: var(--ink); }

    <div class="snip-bar"><span class="sbleft"><span class="lang">${esc(lang)}</span>${sn.note ? `<span class="snote">${fmt(sn.note)}</span>` : ''}</span>

    <pre id="sn-${esc(id)}" tabindex="0" role="group" aria-label="${esc(lang)} snippet"><code>${esc(sn.content)}</code></pre></div>`;

/* The same Feather set and the same attributes as the rail glyphs, drawn rather
   than typed: a "←" is a font glyph, so its weight and its height above the
   baseline are whatever the mono face happens to ship, and it announces itself
   as text before the label gets a chance to. Stroked in currentColor so the
   hover rule tints the arrow with its label. */
const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';

/* A stat tile is a claim and the place that backs it up. The detail line sits
   outside the anchor so `npx skills add …` stays out of the link text; the
   stretched ::after covers it anyway. The target arrives already built — a
   route through href(), or a bare #fragment for a section on this same page.
   Fragments work under both routings because the hash router only claims
   "#/"-prefixed hashes and leaves plain anchors to the browser. Label and
   detail are written here rather than read from a record, so they carry their
   own markup. */
function statTile(n, label, detail, target) {
  /* The newline between the two divs is load-bearing: it makes the accessible
     name "20 design systems studied" rather than "20design systems studied"
     without waiting on a browser to insert the block-level space itself. Two
     block boxes swallow the whitespace, so nothing moves on screen. */
  return `<li class="tile"><a href="${target}"><div class="n">${n}</div>\n`
    + `<div class="l">${label}</div></a><div class="d">${detail}</div></li>`;
}

/* The one jump list on the site. `items` are {id, label}; every id must be on a
   section that carries .jump-sec (or .plat, which predates the class), so the
   scroll lands with clearance and focus has somewhere to go. The delegated
   a[data-jump] handler does both, and its preventDefault is what keeps
   "#essay" from being read as a route by the hash-routed artifact.
   Empty in, nothing out: a page whose groups are all filtered away renders no
   labeled-but-empty list. */
function jumpList(items, label) {
  if (!items.length) return '';
  return `<ul class="jump" aria-label="${esc(label)}">${items.map(i =>
    `<li><a href="#${esc(i.id)}" data-jump="${esc(i.id)}">${esc(i.label)}</a></li>`).join('')}</ul>`;
}

/* `anchor` is the id of the section this row summarizes, and only /techniques
   passes one — the matrix prevalence bars have nothing to jump to. Bare-hash
   hrefs are left alone by the path router's delegated click handler (it only
   claims hrefs starting with "/"), so the browser does the jump. The hash-routed
   artifact has no such escape: "#curated-context" would be read as a route, so
   there the rows stay plain. */
function barRow(label, n, total, anchor) {
  const w = Math.max(2, Math.round(n / total * 100));
  const cells = `<span class="bl">${esc(label)}</span><span class="btrack" aria-hidden="true"><span class="bfill" style="width:${w}%"></span></span><span class="bv">${n}</span>`;
  if (anchor && ROUTING === 'path') {
    return `<li class="bar-row"><a class="bar-link" href="#${esc(anchor)}">${cells}</a></li>`;
  }
  return `<li class="bar-row">${cells}</li>`;
}
function prevalenceBars() {
  const total = DATA.systems.length;
  const rows = MX_COLS.filter(c => c.key !== 'misc').map(c => {
    const n = DATA.systems.filter(s => (s.affordances || []).some(a => c.types.includes(a.type))).length;
    return { label: c.label, n };
  }).sort((a, b) => b.n - a.n);
  return `<ul class="bars">${rows.map(r => barRow(r.label, r.n, total)).join('')}</ul>`;
}

/* A snippet that fits needs neither a tab stop nor a name: only the ones that
   actually scroll sideways are keyboard-operable regions of content. Runs after
   render, in the browser only — the prerender shim's querySelectorAll returns [],
   so the shipped HTML keeps both attributes and each browser prunes what its own
   layout says fits. Snippets stay role="group", never region: /techniques renders
   147 of them and the landmark list is for the one matrix scroller. */
function pruneSnippetTabStops(root) {
  const scope = root && typeof root.querySelectorAll === 'function' ? root : document;
  scope.querySelectorAll('pre[id^="sn-"]').forEach(pre => {
    /* clientWidth 0 means it is inside a closed <details> and has no box to
       measure — and nothing inside a closed disclosure is a tab stop anyway, so
       leave it alone and measure it when the disclosure opens. */
    if (pre.clientWidth && pre.scrollWidth <= pre.clientWidth) {
      pre.removeAttribute('tabindex');
      pre.removeAttribute('role');
    }
  });
}
/* toggle does not bubble, so listen in the capture phase. */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.tagName === 'DETAILS' && d.open) pruneSnippetTabStops(d);
}, true);

/* Edge fades for the matrix while it still has to scroll sideways. Driven by a
   scroll listener and a ResizeObserver so the state is right on load and on
   rotate, not only after the first drag. */
function setupMatrixFades() {
  const wrap = document.getElementById('mxwrap');
  if (!wrap || typeof wrap.querySelector !== 'function') return;
  const sc = wrap.querySelector('.scroller');
  if (!sc || typeof sc.addEventListener !== 'function') return;
  const update = () => {
    const max = (sc.scrollWidth || 0) - (sc.clientWidth || 0);
    const x = sc.scrollLeft || 0;
    const scrolls = max > 1;
    wrap.setAttribute('data-at-start', String(!scrolls || x <= 1));
    wrap.setAttribute('data-at-end', String(!scrolls || x >= max - 1));
  };
  sc.addEventListener('scroll', update, { passive: true });
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(update);
    ro.observe(sc);
    const t = sc.querySelector('table');
    if (t) ro.observe(t);
  }
  update();
}

const NAV = [
  ['overview', 'Overview'],
  ['techniques', 'Techniques'], ['platforms', 'Platforms'], ['insights', 'Insights'], ['methodology', 'Methodology'],
  ['reading', 'Reading'], ['ai', 'For agents'],
];
/* One glyph per section, drawn in the same 24px stroked style as the theme
   toggle. Feather (MIT), which is where the moon and the sun came from too.
   Kept beside NAV rather than inside it: prerender.mjs destructures NAV as
   [route, label] pairs and counts them against routes.json, and a seven-row
   table stays readable without seven paths threaded through it. */
const NAV_ICON_PATHS = {
  overview: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  techniques: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  platforms: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
  insights: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  methodology: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
  reading: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  ai: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
};
/* aria-hidden because the label beside it already says the same thing; an
   announced icon would only make every link read its name twice. */
const navIcon = (r) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON_PATHS[r]}</svg>`;
/* Full page titles, from the same build-time table the prerendered <title> tags
   and the sitemap come from, so an in-page navigation to /techniques leaves the
   tab reading what a crawler sees rather than the one-word nav label. */
const VIEW_TITLES = (DATA.meta && DATA.meta.view_titles) || {};
const NAV_LABEL = {};
NAV.forEach(([r, l]) => { NAV_LABEL[r] = l; });
/* The icon goes inside the anchor and the attributes stay exactly as they were:
   prerender.mjs marks the current page by matching this opening tag, so its
   href and data-r are load-bearing in a second file. */
$('#nav').innerHTML = NAV.map(([r, l]) => `<a href="${r === 'overview' ? href() : href(r)}" data-r="${r}">${navIcon(r)}<span>${l}</span></a>`).join('');
/* The masthead ships as href="/" so the prerendered HTML is right without JS.
   Under hash routing that address is not a route, so point it at the real one. */
$('#brand').setAttribute('href', href());
/* The provenance clause is per view: every page is fixed at the collection
   window except the reading list, and a page carrying both dates tells the
   reader to pick one. */
function footHTML(view) {
  const when = view === 'reading'
    ? `Reading list updated ${esc(longDate(DATA.meta.reading_updated))}`
    : 'Data gathered 26–28 July 2026';
  return `A field study by <a href="https://www.kaelig.fr">Kaelig Deloumeau-Prigent</a> · ${when} · <a href="${href('methodology')}">Methodology</a> · <a href="${REPO_URL}" target="_blank" rel="noopener">Source${NEWTAB}</a> · <a href="${REPO_URL}/issues/new/choose" target="_blank" rel="noopener">Feedback${NEWTAB}</a>`;
}
$('#foot').innerHTML = footHTML(parse().view);

function route(opts) {
  const { view, arg } = parse();
  route.current = view;
  const fn = VIEWS[view] || VIEWS.overview;
  $('#view-root').innerHTML = `<div class="view on">${fn(arg)}</div>`;

  let full = VIEW_TITLES[view] || '';
  if (view === 'system') {
    const s = DATA.systems.find(x => x.id === arg);
    full = `${s ? s.name : 'Not found'} · ${SITE_TITLE}`;
  } else if (!full) {
    const label = NAV_LABEL[view] || '';
    full = label ? `${label} · ${SITE_TITLE}` : BASE_TITLE;
  }
  document.title = full;
  $('#foot').innerHTML = footHTML(view);

  /* A system record is a leaf of the overview now that the matrix lives there. */
  const navActive = view === 'system' ? 'overview' : (VIEWS[view] ? view : 'overview');
  document.querySelectorAll('#nav a').forEach(a => {
    const active = a.dataset.r === navActive;
    a.classList.toggle('on', active);
    if (active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  /* On narrow screens the nav is one scrollable row, so the current section can
     sit past the right edge. Scroll the row, never the document. */
  const nav = $('#nav'), here = $('#nav a[aria-current]');
  if (nav && here && nav.scrollWidth > nav.clientWidth) {
    nav.scrollLeft = Math.max(0, here.offsetLeft - 12);
  }

  if (fn === VIEWS.overview) setupMatrixFades();
  pruneSnippetTabStops();
  window.scrollTo(0, 0);
  if (opts && opts.focus) {
    const main = document.getElementById('main');
    if (main) main.focus({ preventScroll: true });
  }
}

if (ROUTING === 'path') {
  if (/^#\//.test(location.hash)) {
    const p = location.hash.replace(/^#\/?/, '').replace(/\/+$/, '');
    const seg = p.split('/');
    let target = '/';
    if (seg[0] === 'system' && seg[1]) target = '/systems/' + seg[1];
    else if (p && seg[0] !== 'overview') target = '/' + p;
    history.replaceState(null, '', target);
  }
  document.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest('a');
    if (!a || a.hasAttribute('target') || a.hasAttribute('download')) return;
    if (a.origin !== location.origin) return;
    const raw = a.getAttribute('href');
    if (!raw || raw[0] !== '/') return;
    /* A path with a file extension is a real file (the .md / .json record
       mirrors, the data downloads), not a route. Let the browser fetch it. */
    if (/\.[a-z0-9]{1,8}$/i.test(a.pathname)) return;
    e.preventDefault();
    if (a.pathname !== location.pathname) history.pushState(null, '', a.pathname);
    route({ focus: true });
  });
  window.addEventListener('popstate', () => route({ focus: true }));
} else {
  /* Only "#/"-prefixed hashes are routes. A plain "#systems" is an in-page
     anchor (the stat tiles use one); re-rendering on it would scroll the reader
     back to the top of the view they were trying to move within. The one time a
     plain anchor still routes is when back/forward lands it on a different view
     than the one on screen — the anchor's scroll is lost, but the page is right. */
  window.addEventListener('hashchange', () => {
    if (/^#\//.test(location.hash) || parse().view !== route.current) route({ focus: true });
  });
}

/* The announcement lives in one document-level status region, not on 300+
   buttons. Cleared after the visible swap so a second copy re-announces. */
let statusTimer = null;
function say(msg) {
  const n = document.getElementById('copy-status');
  if (!n) return;
  n.textContent = msg;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { n.textContent = ''; }, 2000);
}
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-copy]');
  if (!b) return;
  const label = b.querySelector('.btxt') || b;
  const pre = document.getElementById('sn-' + b.dataset.copy);
  if (pre && navigator.clipboard) navigator.clipboard.writeText(pre.textContent).then(() => {
    label.textContent = 'copied'; say('Copied to clipboard');
    setTimeout(() => { label.textContent = 'copy'; }, 1200);
  }).catch(() => {
    label.textContent = "couldn't copy"; say("Couldn't copy");
    setTimeout(() => { label.textContent = 'copy'; }, 1500);
  });
});

/* Platform jump links. preventDefault keeps the hash-routed artifact from
   treating "#figma" as a route, and moving focus means the keyboard follows. */
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-jump]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const target = document.getElementById(a.dataset.jump);
  if (!target) return;
  e.preventDefault();
  target.scrollIntoView({ block: 'start' });
  target.focus({ preventScroll: true });
});

function syncToggle(isDark) {
  const t = $('#theme-toggle');
  if (t) t.setAttribute('aria-pressed', String(!!isDark));
}
function darkNow() {
  const cur = document.documentElement.getAttribute('data-theme');
  return cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
}
$('#theme-toggle').addEventListener('click', () => {
  const next = darkNow() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  syncToggle(next === 'dark');
  try { localStorage.setItem('theme', next); } catch (e) {}
});
syncToggle(darkNow());

/* Expand every collapsed section for printing, then put it back. */
let printRestore = [];
window.addEventListener('beforeprint', () => {
  printRestore = [];
  document.querySelectorAll('details').forEach(d => {
    printRestore.push([d, d.open]);
    d.open = true;
  });
});
window.addEventListener('afterprint', () => {
  printRestore.forEach(([d, was]) => { d.open = was; });
  printRestore = [];
});

/* ---------- WebMCP ----------
   Registers the same four read-only tools the /mcp server exposes, as page tools
   an in-browser agent can call instead of scraping the DOM. document.modelContext
   is a W3C community-group draft (21 July 2026 editor's draft); today it exists
   only in Chrome behind a flag or the 149–156 origin trial, so on every other
   browser the guard below returns and nothing else in here runs. Kept isolated on
   purpose: if the spec renames the entry point again, this is a one-line fix. */
function registerReportTools(DATA) {
  const mc = typeof document !== 'undefined' && document.modelContext;
  if (!mc || typeof mc.registerTool !== 'function') return null;

  const uniq = xs => Array.from(new Set(xs.filter(Boolean))).sort();
  const systems = DATA.systems || [];
  const IDS = systems.map(s => s.id);
  const MATURITY = uniq(systems.map(s => s.ai_maturity));
  const CATEGORY = uniq(systems.map(s => s.category));
  const AFF_TYPE = uniq(systems.flatMap(s => (s.affordances || []).map(a => a.type)));
  const TECH_CAT = uniq(systems.flatMap(s => (s.techniques || []).map(t => t.category)));
  const SNAPSHOT = 'Snapshot of 26–28 July 2026. Cite the source_url on each record, not this page.';

  /* The dataset quotes instruction files from third-party repositories, so tool
     output is other people's text: read-only, and flagged as untrusted content. */
  const annotations = { readOnlyHint: true, untrustedContentHint: true };
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const line = s => ({
    id: s.id, name: s.name, org: s.org, category: s.category, ai_maturity: s.ai_maturity,
    docs_url: s.docs_url, repo_url: s.repo_url, summary: s.summary,
    affordance_types: uniq((s.affordances || []).map(a => a.type)),
    counts: { affordances: (s.affordances || []).length, techniques: (s.techniques || []).length },
  });
  const out = v => JSON.stringify({ source: 'State of AI in Design Systems, July 2026', note: SNAPSHOT, ...v });

  const TOOLS = [
    {
      name: 'list_systems',
      title: 'List design systems',
      description: `List the ${systems.length} design systems surveyed in this report, one compact record each: `
        + 'id, org, category, AI maturity, links, which affordance types it ships, and a one-line summary. '
        + 'Filter first, then call get_system for the full record. ' + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, properties: {
          maturity: { type: 'string', enum: MATURITY, description: 'How far the system has gone on AI consumption.' },
          category: { type: 'string', enum: CATEGORY },
          has_affordance: { type: 'string', enum: AFF_TYPE, description: 'Only systems shipping at least one affordance of this type.' },
        },
      },
      execute: async (input) => {
        const a = input || {};
        let rows = systems;
        if (a.maturity) rows = rows.filter(s => s.ai_maturity === a.maturity);
        if (a.category) rows = rows.filter(s => s.category === a.category);
        if (a.has_affordance) rows = rows.filter(s => (s.affordances || []).some(x => x.type === a.has_affordance));
        return out({ total: rows.length, of: systems.length, systems: rows.map(line) });
      },
    },
    {
      name: 'get_system',
      title: 'Get one design system',
      description: 'The full record for one surveyed design system: summary, every AI affordance, every '
        + 'model-coercion technique with the snippet it was quoted from, platform integrations, gaps and sources. '
        + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, required: ['id'],
        properties: { id: { type: 'string', enum: IDS, description: 'System id, as returned by list_systems.' } },
      },
      execute: async (input) => {
        const s = systems.find(x => x.id === (input || {}).id);
        if (!s) return out({ error: 'No system with that id.', valid_ids: IDS });
        return out({ system: s, page: location.origin + '/systems/' + s.id });
      },
    },
    {
      name: 'search',
      title: 'Search the survey',
      description: 'Full-text search across system summaries, affordances, coercion techniques and the quoted '
        + 'snippets. Words are ANDed. Returns short excerpts with the source URL for each hit. ' + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, required: ['query'],
        properties: {
          query: { type: 'string', maxLength: 120, description: 'Words to look for, e.g. "code connect".' },
          kind: { type: 'string', enum: ['all', 'system', 'affordance', 'technique'] },
          limit: { type: 'integer', minimum: 1, maximum: 25, description: 'Default 10.' },
        },
      },
      execute: async (input) => {
        const a = input || {};
        const words = String(a.query || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 8);
        if (!words.length) return out({ error: 'Empty query.' });
        const kind = a.kind || 'all';
        const limit = Math.min(Math.max(parseInt(a.limit, 10) || 10, 1), 25);
        const hits = [];
        for (const s of systems) {
          const push = (k, name, text, url) => {
            if (hits.length >= limit) return;
            const hay = (name + ' ' + text).toLowerCase();
            if (words.every(w => hay.includes(w))) {
              hits.push({ kind: k, system: s.name, system_id: s.id, name, excerpt: String(text).slice(0, 300), source_url: url || null });
            }
          };
          if (kind === 'all' || kind === 'system') push('system', s.name, s.summary || '', s.docs_url);
          if (kind === 'all' || kind === 'affordance') {
            for (const x of s.affordances || []) push('affordance', x.name, [x.description, x.snippet && x.snippet.content].filter(Boolean).join(' '), (x.snippet && x.snippet.source_url) || x.docs_url || x.code_url);
          }
          if (kind === 'all' || kind === 'technique') {
            for (const t of s.techniques || []) push('technique', t.name, [t.description, t.snippet && t.snippet.content].filter(Boolean).join(' '), t.snippet && t.snippet.source_url);
          }
        }
        return out({ query: words.join(' '), returned: hits.length, limit, hits });
      },
    },
    {
      name: 'get_stats',
      title: 'Report totals and filter vocabulary',
      description: 'Headline counts for the report plus the exact enum values the other tools accept as filters. '
        + 'Call this first if you are unsure what to ask for. ' + SNAPSHOT,
      inputSchema: { type: 'object', additionalProperties: false, properties: {} },
      execute: async () => out({
        counts: DATA.meta.counts,
        enums: { ai_maturity: MATURITY, category: CATEGORY, affordance_type: AFF_TYPE, technique_category: TECH_CAT, system_id: IDS },
        methodology: location.origin + '/methodology.md',
      }),
    },
  ];

  const registered = [];
  for (const t of TOOLS) {
    try {
      mc.registerTool({ ...t, annotations }, ctl ? { signal: ctl.signal } : {});
      registered.push(t.name);
    } catch (e) { /* a spec change must not break the page */ }
  }
  return { tools: registered, unregister: () => ctl && ctl.abort() };
}
try { registerReportTools(DATA); } catch (e) { /* never let page tools break the report */ }

route();
</script>
</body>
