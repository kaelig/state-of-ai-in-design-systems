    paRow('copy', `<button type="button" class="pgrow" data-page-md="${esc(path)}">`, '</button>',
      'Copy page', 'Copy this page as Markdown'),
    /* The download link is the existing one, unchanged, with the row drawn
       around it: it is the fallback the copy row announces when the clipboard
       refuses, and the build asserts its href and download attribute on all 27
       routes. Its own markdown mark is hidden in here by CSS so the row keeps
       the glyph column every other row lands in. */
    `<li class="pgrow pgrow-dl">${paIcon('download')}<span class="pgt">${mdDownload(view, arg)}</span><span class="pgd">Save the .md file</span></li>`,
    /* Bare q on both, and nothing else. ChatGPT drops the prompt outright if
       hints=search rides along, and claude.ai reads q and ignores prompt.
       Neither one submits by itself, so the line under the title says the
       assistant opens with the page, not that it has answered. */
    paExt('chat', `https://chatgpt.com/?q=${q}`, 'Open in ChatGPT', 'Ask questions about this page'),
    paExt('chat', `https://claude.ai/new?q=${q}`, 'Open in Claude', 'Ask questions about this page'),
  ];
  if (cmd) rows.push(paRow('terminal', `<button type="button" class="pgrow" data-copy-text="${esc(cmd)}">`, '</button>',
    'Copy MCP install command', 'Copy the one-line command'));
  if (cursor) rows.push(paExt('server', cursor, 'Connect to Cursor', 'Install the MCP server in Cursor'));
  if (vscode) rows.push(paExt('server', vscode, 'Connect to VS Code', 'Install the MCP server in VS Code'));
  return `<div class="pageacts">
    <div class="pa-split">
      <button type="button" class="pa-main" popovertarget="page-actions" data-page-md="${esc(path)}">${paIcon('copy')}<span class="pgt">Copy page</span></button>
      <button type="button" class="pa-more" popovertarget="page-actions" aria-label="More ways to use this page">${paIcon('chevron')}</button>
    </div>
    <ul class="pgmenu" role="list" popover id="page-actions" aria-label="Ways to use this page">${rows.join('')}</ul>
  </div>`;
}
/* The eyebrow-and-affordance row every content route opens with. All eight
   views hand-wrote it, which meant eight places to edit the moment that row
   carried anything more than a download link. The record view is the one that
   differs: it computes its eyebrow and escapes it, while the other seven pass
   literals through raw. Escaping all eight here is byte-identical today,
   because no current literal holds a character esc() rewrites, and it stops
   the next literal that does from being an injection. */
function pageTop(eyebrow, view, arg) {
  return `<div class="pagetop"><p class="eyebrow">${esc(eyebrow)}</p>${pageActions(view, arg)}</div>`;
}
function matChip(m) { return `<span class="chip mat-${esc(m)}" title="${esc(MAT_DEF[m] || '')}">${esc(MAT[m] || m)}</span>`; }
function offChip(o) { return o ? '<span class="chip official">official</span>' : '<span class="chip">community</span>'; }
function audChip(a) { return a ? `<span class="chip">${esc(a)}</span>` : ''; }
function snippetHTML(sn, id) {
  if (!sn || !sn.content) return '';
  const lang = sn.language || 'text';
  /* No aria-label on the button: it would pin the accessible name and the
     "copied" swap would never be announced. The language rides in sr-only text
     so 300+ buttons are still told apart, and #copy-status does the announcing. */
  return `<div class="snip">
    <div class="snip-bar"><span class="sbleft"><span class="lang">${esc(lang)}</span>${sn.note ? `<span class="snote">${fmt(sn.note)}</span>` : ''}</span>
      <span class="acts">${sn.source_url ? extLink(sn.source_url, esc(srcLabel(sn.source_url))) : ''}<button type="button" data-copy="${esc(id)}"><span class="btxt">copy</span><span class="sr-only"> ${esc(lang)} snippet</span></button></span></div>
    <pre id="sn-${esc(id)}" tabindex="0" role="group" aria-label="${esc(lang)} snippet"><code>${esc(sn.content)}</code></pre></div>`;
}
function affordanceHTML(a, sysId, i) {
  const id = `${sysId}-a${i}`;
  return `<li><details class="aff">
    <summary><span class="chip">${esc(TYPE_LABEL[a.type] || a.type)}</span><span class="nm">${fmt(a.name)}</span>${offChip(a.official)}${audChip(a.audience)}</summary>
    <div class="aff-body">
      <p class="desc">${fmt(a.description)}</p>
      ${snippetHTML(a.snippet, id)}
      <div class="links">
        ${a.docs_url ? extLink(a.docs_url, 'docs') : ''}
        ${a.code_url ? extLink(a.code_url, 'code') : ''}
      </div>
      ${a.notes ? `<p class="note">${fmt(a.notes)}</p>` : ''}
    </div></details></li>`;
}
function techniqueHTML(t, sysId, i, withSys) {
  const id = `${sysId}-t${i}`;
  const sys = withSys ? DATA.systems.find(s => s.id === sysId) : null;
  return `<li><details class="tech-ex">
    <summary>${sys ? `<span class="sysref">${esc(sys.name)}</span>` : `<span class="chip">${esc(CAT_LABEL[t.category] || t.category)}</span>`}<span class="nm">${fmt(t.name)}</span></summary>
    <div class="tb">
      <p>${fmt(t.description)}</p>
      ${snippetHTML(t.snippet, id)}
    </div></details></li>`;
}

/* The same Feather set and the same attributes as the rail glyphs, drawn rather
   than typed: a "←" is a font glyph, so its weight and its height above the
   baseline are whatever the mono face happens to ship, and it announces itself
   as text before the label gets a chance to. Stroked in currentColor so the
   hover rule tints the arrow with its label. */
const BACK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"'
  + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>';

/* ---------- views ---------- */
const VIEWS = {
  overview() {
    const m = DATA.meta;
    const row = s => {
      const cells = MX_COLS.map(c => {
        const hits = (s.affordances || []).filter(a => c.types.includes(a.type) && a.present !== false);
        /* Absence draws nothing. The sr-only text stays, so the cell still says
           "None found" to anyone not reading it by eye. */
        if (!hits.length) return '<td><span class="sr-only">None found</span></td>';
        /* Asked separately, not as one either/or. The old code took
           hits.some(a => a.official) as the whole answer, which silently turned
           every cell holding both an official and a community artifact into a
           plain official one. */
        const official = hits.some(a => a.official);
        const community = hits.some(a => !a.official);
        const names = hits.map(a => `${a.name}${a.official ? '' : ' (community)'}`).join(' · ');
        /* Ring means community, core means official, so the mark is assembled
           from what the cell actually holds rather than chosen from a list of
           three: a cell with both is the official core inside the community ring. */
        const core = '<span class="core"></span>';
        const glyph = community
          ? `<span class="ring" aria-hidden="true">${official ? core : ''}</span>`
          : `<span class="core" aria-hidden="true"></span>`;
        const word = official ? (community ? 'Official and community' : 'Official') : 'Community';
        /* The cell links to the artifact itself — docs if there are docs, the
           repo otherwise. Official beats community when both are present. */
        const best = hits.find(a => a.official && (a.docs_url || a.code_url)) || hits.find(a => a.docs_url || a.code_url);
        const url = best ? (best.docs_url || best.code_url) : null;
        if (!url) return `<td title="${esc(names)}">${glyph}<span class="sr-only">${word}: ${esc(names)}</span></td>`;
        return `<td class="cl" title="${esc(names)}"><a href="${esc(url)}" target="_blank" rel="noopener">${glyph}<span class="sr-only">${word}: ${esc(names)} (opens in new tab)</span></a></td>`;
      }).join('');
      return `<tr><th scope="row" class="sys"><a href="${href('systems', s.id)}">${esc(s.name)}</a></th>${cells}</tr>`;
    };
    /* One tbody per maturity cohort, opened by a group header row. The chip that
       used to sit in every row header says the same thing 20 times. The rung
       glyph counts the level up the four-point scale; it is aria-hidden because
       the cohort name beside it already says the level. */
    const span = MX_COLS.length + 1;
    const groups = MAT_ORDER.map(k => {
      const sys = DATA.systems.filter(s => s.ai_maturity === k);
      if (!sys.length) return '';
      return `<tbody><tr class="mx-group mat-${k}"><th colspan="${span}" scope="rowgroup"><span class="gl">${matRungs(k)}<span class="gt">${MAT[k]} · <span class="gn">${sys.length}</span></span></span></th></tr>`
        + sys.map(row).join('') + '</tbody>';
    }).join('');
    return `${pageTop('AI-friendly design systems, beyond the hype', 'overview')}
      <h1>How design systems talk to machines</h1>
      <p class="lede">${fmt(DATA.insights.lede)}</p>
      <p class="byline">By <a href="https://www.kaelig.fr">Kaelig Deloumeau-Prigent</a> · data gathered 26–28 July 2026</p>
      <hr class="accent-rule">
      <section id="systems" tabindex="-1">
      <div class="mx-legend"><span><span class="core" aria-hidden="true"></span>official</span><span><span class="ring" aria-hidden="true"></span>community</span><span><span class="ring" aria-hidden="true"><span class="core"></span></span>both</span></div>
      <div class="mxwrap" id="mxwrap"><div class="scroller" tabindex="0" role="region" aria-label="Affordance matrix"><table class="mx">
        <caption class="sr-only">Which AI affordances each of the ${m.counts.systems} design systems ships, and whether they’re official, community-built, or both. An empty cell means no such affordance was found.</caption>
        <thead><tr><th scope="col" class="sys">System</th>${MX_COLS.map(c => `<th scope="col">${esc(c.label)}</th>`).join('')}</tr></thead>
        ${groups}</table></div><span class="fade" aria-hidden="true"></span></div>
      </section>
      <h2>Affordance prevalence</h2>
      <p class="h2-sub">Number of systems (of ${m.counts.systems}) shipping each affordance, counting official and community.</p>
      ${prevalenceBars()}
      <aside class="correct" aria-label="Read this report with an AI assistant">
        <p class="t">Ask this study anything</p>
        <p>Point an AI assistant at this report and it answers from the ${m.counts.systems} records here, with a source link on each one. Connect it to the tool you already use and it will draw up an AI roadmap for your own design system.</p>
        <a href="${href('ai')}">Show me how</a>
      </aside>`;
  },

  system(id) {
    const s = DATA.systems.find(x => x.id === id);
    if (!s) return `<h1>Not found</h1><p>There's no system at this address. <a href="${href()}">Back to the overview</a>.</p>`;
    const m = s.maintenance || {}, b = s.building_vs_consumption || {};
    return `<a class="backlink" href="${href()}">${BACK_ICON}all systems</a>
      ${pageTop(SYS_CATEGORY[s.category] || s.category || 'Record', 'system', s.id)}
      <div class="dhead"><h1>${esc(s.name)}</h1>${matChip(s.ai_maturity)}</div>
      ${mirrorLinks('systems', s.id, s.name)}
      <p class="detail-sum">${fmt(s.summary)}</p>
      <hr class="accent-rule">
      <dl class="metagrid">
        <div><dt class="k">Org</dt><dd class="v">${esc(s.org || '—')}</dd></div>
        <div><dt class="k">Repo</dt><dd class="v">${extLink(s.repo_url, esc((s.repo_url || '').replace('https://github.com/', '')))}</dd></div>
        <div><dt class="k">Docs</dt><dd class="v">${extLink(s.docs_url, esc((s.docs_url || '').replace(/^https?:\/\//, '')))}</dd></div>
        <div class="wide"><dt class="k">Release(s) audited</dt><dd class="v">${fmt(m.last_release || '—')}</dd></div>
      </dl>
      <div class="twocol">
        <div class="col"><h2 class="t">For consumers — building with it</h2><p>${fmt(b.for_consumers || '—')}</p></div>
        <div class="col"><h2 class="t">For builders — maintaining it</h2><p>${fmt(b.for_builders || '—')}</p></div>
      </div>
      <h2>Affordances <span class="hcount">· ${(s.affordances || []).length}</span></h2>
      <p class="h2-sub">Concrete AI-facing artifacts this system ships. Expand for snippets and links.</p>
      ${(s.affordances || []).length ? `<ul class="afflist">${s.affordances.map((a, i) => affordanceHTML(a, s.id, i)).join('')}</ul>` : ''}
      <h2>Coercion techniques <span class="hcount">· ${(s.techniques || []).length}</span></h2>
      <p class="h2-sub">How this system keeps models on-system instead of inventing components.</p>
      <div class="tech-cat">${(s.techniques || []).length ? `<ul class="exlist">${s.techniques.map((t, i) => techniqueHTML(t, s.id, i, false)).join('')}</ul>` : ''}</div>
      ${(s.platform_integrations || []).length ? `<h2>Platform integrations</h2>
        ${s.platform_integrations.map(p => `<h3 class="pi">${logoIcon(p.platform)}${esc(platLabel(p.platform))}</h3>
        <p class="body-block">${fmt(p.description)} ${p.url ? extArrow(p.url, `${platLabel(p.platform)} integration`) : ''}</p>`).join('')}` : ''}
      ${s.gaps ? `<h2>Gaps &amp; open questions</h2><p class="body-block gaps">${fmt(s.gaps)}</p>` : ''}
      <h2>Sources</h2>
      <ul class="srclist">${(s.sources || []).map(u => `<li>${extLink(u, urlParts(u))}</li>`).join('')}</ul>
      <aside class="correct" aria-label="Suggest a correction">
        <p class="t">Out of date, or wrong?</p>
        <p>If something here is stale or missing, a correction takes about a minute on GitHub — and the next person who looks this up gets the right answer.</p>
        ${extLink(correctionURL(s), 'Suggest a correction')}
      </aside>`;
  },

  techniques() {
    const byCat = {};
    for (const s of DATA.systems) for (let i = 0; i < (s.techniques || []).length; i++) {
      const t = s.techniques[i];
      (byCat[t.category] = byCat[t.category] || []).push({ t, sysId: s.id, i });
    }
    const order = Object.keys(CAT_DEF).filter(c => byCat[c]).sort((a, b) => byCat[b].length - byCat[a].length);
    return `${pageTop('The playbook', 'techniques')}<h1>How teams coerce models into staying on-system</h1>
      <p class="lede">${fmt(DATA.insights.techniques_lede)}</p>
      <hr class="accent-rule">
      <ul class="bars">${order.map(c => barRow(CAT_LABEL[c], byCat[c].length, DATA.meta.counts.techniques, c)).join('')}</ul>
      ${order.map(c => `<section class="tech-cat" id="${esc(c)}">
        <div class="th"><h2>${esc(CAT_LABEL[c])}</h2><span class="n">${byCat[c].length} instances · ${new Set(byCat[c].map(x => x.sysId)).size} systems</span></div>
        <p class="def">${esc(CAT_DEF[c])}</p>
        <ul class="exlist">${byCat[c].map(x => techniqueHTML(x.t, x.sysId, x.i, true)).join('')}</ul>
      </section>`).join('')}`;
  },

  platforms() {
    return `${pageTop('The tooling layer', 'platforms')}<h1>Platforms</h1>
      <p class="lede">${fmt(DATA.insights.platforms_lede)}</p>
      <hr class="accent-rule">
      ${jumpList(DATA.platforms.map(p => ({ id: p.id, label: p.name.replace(/\s*\([^()]*\)$/, ''), icon: logoIcon(p.id) })), 'Jump to a platform')}
      ${DATA.platforms.map(p => `<section class="plat" id="${esc(p.id)}" tabindex="-1">
        <h2>${logoIcon(p.id)}${esc(p.name)}</h2>
        ${mirrorLinks('platforms', p.id, p.name)}
        <p class="sum">${fmt(p.summary)}</p>
        <h3 class="caps">Capabilities</h3>
        ${(p.capabilities || []).length ? `<ul class="exlist">${p.capabilities.map((c, i) => `<li><details class="tech-ex">
          <summary><span class="nm">${fmt(c.title)}</span>${audChip(c.audience)}</summary>
          <div class="tb"><p>${fmt(c.description)} ${c.url ? extArrow(c.url, `${p.name}: ${c.title}`) : ''}</p>
          ${snippetHTML(c.snippet, `${p.id}-c${i}`)}</div>
        </details></li>`).join('')}</ul>` : ''}
        ${p.adoption_by_design_systems ? `<p class="adopt"><strong>Adoption:</strong> ${fmt(p.adoption_by_design_systems)}</p>` : ''}
      </section>`).join('')}`;
  },

  /* The findings lead: they are the study's headline conclusions, they moved
     here when the overview became the systems table, and /insights.md has
     always opened with them. The three sections after them are the three
     things the lede promises, in that order, so the jump rows still read as a
     contents list. The essay ran headingless before this; it needs a heading
     to be jumped to, and /insights.md already calls it "Essay". */
  insights() {
    const patterns = xs => `<ol class="findings">${xs.map(x =>
      `<li><h3>${esc(x.title)}</h3><p>${fmt(x.body)}</p></li>`).join('')}</ol>`;
    const secs = [
      { id: 'findings', label: 'Findings' },
      { id: 'essay', label: 'Essay' },
      { id: 'convergence', label: 'Convergent patterns' },
      { id: 'divergence', label: 'Divergent bets' },
    ];
    return `${pageTop('Synthesis', 'insights')}<h1>Similarities, differences, and what actually works</h1>
      <p class="lede">${fmt(DATA.insights.insights_lede)}</p>
      <hr class="accent-rule">
      ${jumpList(secs, 'Jump to a section')}
      <section class="jump-sec" id="findings" tabindex="-1"><h2>Findings</h2>
        ${patterns(DATA.insights.findings)}
      </section>
      <section class="jump-sec" id="essay" tabindex="-1"><h2>Essay</h2>
        <div class="prose">${DATA.insights.essay.map(p => `<p>${fmt(p)}</p>`).join('')}</div>
      </section>
      <section class="jump-sec" id="convergence" tabindex="-1"><h2>Convergent patterns</h2>
        ${patterns(DATA.insights.convergence)}
      </section>
      <section class="jump-sec" id="divergence" tabindex="-1"><h2>Divergent bets</h2>
        ${patterns(DATA.insights.divergence)}
      </section>`;
  },

  methodology() {
    return `${pageTop('How this was made', 'methodology')}<h1>Methodology</h1>
      <p class="lede">${fmt(DATA.insights.methodology_lede)}</p>
      <hr class="accent-rule">
      <div class="prose">${DATA.insights.methodology.map(p => `<p>${fmt(p)}</p>`).join('')}</div>
      <h2>Caveats</h2>
      <div class="prose"><ul>${DATA.insights.caveats.map(c => `<li>${esc(c)}</li>`).join('')}</ul></div>`;
  },

  /* The one view whose date is its own. Everything else on the site quotes the
     collection window; this list moves, so it states when it last did and says
     plainly that it is not part of the frozen set. */
  reading() {
    const rs = DATA.reading || [], m = DATA.meta;
    const KIND = { study: 'Studies, surveys and reports', tool: 'Models and tools',
      essay: 'Essays', talk: 'Talks', course: 'Courses' };
    /* Anything added after the list was first published states when. It is a
       record, not a "new" flag, so it is permanent and reads as one — the
       founding batch is the baseline and stays unmarked. */
    const founded = rs.reduce((a, r) => r.added_on < a ? r.added_on : a, '9999-99-99');
    const entry = r => `<li>
      <span class="t">${extLink(r.url, esc(r.title))}</span>
      <span class="by">${esc(r.author)}${r.published ? ' · ' + esc(longDate(r.published)) : ''}</span>
      <p>${fmt(r.description)}</p>
      ${r.quote ? `<blockquote>${esc(r.quote)}</blockquote>` : ''}
      ${r.price ? `<span class="cost">${esc(r.price.amount)} — ${esc(r.price.buys)}</span>` : ''}
      ${r.added_on > founded ? `<span class="added">Added ${esc(longDate(r.added_on))}</span>` : ''}
    </li>`;
    /* One filtered list feeds the jump links and the sections both, so a link
       cannot point at a kind that has no entries and was never rendered. */
    const kinds = (m.reading_kinds || []).filter(k => rs.some(r => r.kind === k));
    const groups = kinds.map(k =>
      `<section class="jump-sec" id="${esc(k)}" tabindex="-1"><h2>${esc(KIND[k] || k)}</h2>
        <ul class="readlist">${rs.filter(r => r.kind === k).map(entry).join('')}</ul>
      </section>`).join('');
    return `${pageTop('Further reading', 'reading')}<h1>Further reading</h1>
      <p class="lede">${fmt(DATA.insights.reading_lede)}</p>
      <p class="byline">Last updated ${esc(longDate(m.reading_updated))}</p>
      <hr class="accent-rule">
      ${jumpList(kinds.map(k => ({ id: k, label: KIND[k] || k })), 'Jump to a section')}
      ${groups}
      <div class="prose"><p>Something missing? ${extLink(REPO_URL + '/issues/new?template=reading-suggestion.yml',
        'Suggest it')}. Everything listed gets opened and read first.</p></div>`;
  },

  /* Copy comes from DATA.ai_page, compiled by scripts/build_md.py — the same
     blocks /ai.md renders, so the page and its markdown twin cannot diverge. */
  ai() {
    const c = DATA.ai_page;
    if (!c) return `<h1>Use this report with AI tools</h1>
      <p class="lede">This page is generated by the build and is not available in this copy of the site.</p>`;
    const block = (b, key) => {
      if (b.type === 'prose') return `<div class="prose"><p>${fmt(b.text)}</p></div>`;
      if (b.type === 'list') return `<div class="prose"><ul>${b.items.map(i => `<li>${fmt(i)}</li>`).join('')}</ul></div>`;
      if (b.type === 'links') return `<ul class="ai-links">${b.items.map(i =>
        `<li>${extLink(i.url, esc(i.label))}<span class="note">${fmt(i.note)}</span></li>`).join('')}</ul>`;
      if (b.type === 'code') return snippetHTML({ language: b.lang, content: b.text }, key);
      /* One labeled panel per client, exactly the markup this block has always
         emitted, now each in a box of its own with an id and its label repeated
         as data. setupConfigTabs() reads those two and builds a tab strip into
         the empty .tabstrip below; without it the strip stays empty (and
         :empty-hidden) and all six configs render stacked under their own h3s,
         which is what the prerendered file — the one every crawler reads — says.
         The markdown twin has no tabs and renders the same six as h3 sections;
         that is scripts/build_md.py's business and stays byte-identical. */
      if (b.type === 'configs') return `<div class="configs" data-configs>
        <div class="tabwrap"><div class="tabstrip"></div></div>
        ${b.items.map((i, n) => {
          const cid = `${key}-${i.id || n}`;
          /* The install link is its own field, never markdown inside `note`:
             fmt() rewrites backticks and emphasis and has no link rule, so a
             [label](url) written there would ship as literal text on the page
             while working in /ai.md — the two surfaces disagreeing is exactly
             what the shared block model exists to prevent. */
          const install = i.install_url
            ? `<p class="cfg-install">${extLink(i.install_url, esc(i.install_label))}</p>`
            : '';
          return `<div class="config" id="cfgp-${esc(cid)}" data-config-label="${esc(i.label)}"><h3>${esc(i.label)}</h3>
        <p class="h2-sub">${fmt(i.note)}</p>
        ${install}
        ${snippetHTML({ language: i.lang, content: i.code }, cid)}</div>`;
        }).join('')}</div>`;
      return '';
    };
    const [first, ...rest] = c.sections;
    /* The list and the sections are mapped from the same `rest`, so a link
       cannot outlive the section it points at. `first` is the intro: it renders
       into the head with no wrapper of its own, so it has nothing to jump to. */
    const jump = jumpList(rest.map(sec => ({ id: sec.id, label: sec.heading })), 'Jump to a section');
    const head = `${pageTop('Ask this study', 'ai')}<h1>${esc(c.title)}</h1>
      <p class="lede">${fmt(first.blocks[0].text)}</p>
      <hr class="accent-rule">
      ${first.blocks.slice(1).map((b, i) => block(b, `ai-${first.id}-${i}`)).join('')}
      ${jump}`;
    return head + rest.map(sec => `<section class="jump-sec" id="${esc(sec.id)}" tabindex="-1">
      <h2>${esc(sec.heading)}</h2>
      ${sec.blocks.map((b, i) => block(b, `ai-${sec.id}-${i}`)).join('')}
    </section>`).join('');
  },
};

/* The one jump list on the site. `items` are {id, label}; every id must be on a
   section that carries .jump-sec (or .plat, which predates the class), so the
   scroll lands with clearance and focus has somewhere to go. The delegated
   a[data-jump] handler does both, and its preventDefault is what keeps
   "#essay" from being read as a route by the hash-routed artifact.
   Empty in, nothing out: a page whose groups are all filtered away renders no
   labeled-but-empty list. */
function jumpList(items, label) {
  if (!items.length) return '';
  /* i.icon is optional and is the one field here that is not escaped: it is
     markup the build resolved from an SVG file, not a string off a record.
     Every field that does come off a record still goes through esc(), and the
     two are kept apart on the line so that stays visible. Pages that pass plain
     items — /ai, /insights, /reading — render exactly as they did. */
  return `<ul class="jump" aria-label="${esc(label)}">${items.map(i =>
    `<li><a href="#${esc(i.id)}" data-jump="${esc(i.id)}">${i.icon || ''}${esc(i.label)}</a></li>`).join('')}</ul>`;
}

/* `anchor` is the id of the section this row summarizes, and only /techniques
   passes one — the matrix prevalence bars have nothing to jump to. Bare-hash
   hrefs are left alone by the path router's delegated click handler (it only
   claims hrefs starting with "/"), so the browser does the jump. The hash-routed
   artifact has no such escape: "#curated-context" would be read as a route, so
   there the rows stay plain. */
function barRow(label, n, total, anchor) {
  const w = Math.max(2, Math.round(n / total * 100));
  const cells = `<span class="bl">${esc(label)}</span><span class="btrack" aria-hidden="true"><span class="bfill" style="width:${w}%"></span></span><span class="bv">${n}</span>`;
  if (anchor && ROUTING === 'path') {
    return `<li class="bar-row"><a class="bar-link" href="#${esc(anchor)}">${cells}</a></li>`;
  }
  return `<li class="bar-row">${cells}</li>`;
}
function prevalenceBars() {
  const total = DATA.systems.length;
  const rows = MX_COLS.filter(c => c.key !== 'misc').map(c => {
    const n = DATA.systems.filter(s => (s.affordances || []).some(a => c.types.includes(a.type) && a.present !== false)).length;
    return { label: c.label, n };
  }).sort((a, b) => b.n - a.n);
  return `<ul class="bars">${rows.map(r => barRow(r.label, r.n, total)).join('')}</ul>`;
}

/* A snippet that fits needs neither a tab stop nor a name: only the ones that
   actually scroll sideways are keyboard-operable regions of content. Runs after
   render, in the browser only — the prerender shim's querySelectorAll returns [],
   so the shipped HTML keeps both attributes and each browser prunes what its own
   layout says fits. Snippets stay role="group", never region: /techniques renders
   147 of them and the landmark list is for the one matrix scroller. */
function pruneSnippetTabStops(root) {
  const scope = root && typeof root.querySelectorAll === 'function' ? root : document;
  scope.querySelectorAll('pre[id^="sn-"]').forEach(pre => {
    /* clientWidth 0 means it is inside a closed <details> and has no box to
       measure — and nothing inside a closed disclosure is a tab stop anyway, so
       leave it alone and measure it when the disclosure opens. */
    if (pre.clientWidth && pre.scrollWidth <= pre.clientWidth) {
      pre.removeAttribute('tabindex');
      pre.removeAttribute('role');
    }
  });
}
/* toggle does not bubble, so listen in the capture phase. */
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.tagName === 'DETAILS' && d.open) pruneSnippetTabStops(d);
}, true);

/* The matrix's right-edge fade, while it still has to scroll sideways. Driven by
   a scroll listener and a ResizeObserver so the state is right on load and on
   rotate, not only after the first drag. */
function setupMatrixFades() {
  const wrap = document.getElementById('mxwrap');
  if (!wrap || typeof wrap.querySelector !== 'function') return;
  const sc = wrap.querySelector('.scroller');
  if (!sc || typeof sc.addEventListener !== 'function') return;
  const update = () => {
    const max = (sc.scrollWidth || 0) - (sc.clientWidth || 0);
    const x = sc.scrollLeft || 0;
    const scrolls = max > 1;
    wrap.setAttribute('data-at-end', String(!scrolls || x >= max - 1));
  };
  sc.addEventListener('scroll', update, { passive: true });
  if (typeof ResizeObserver === 'function') {
    const ro = new ResizeObserver(update);
    ro.observe(sc);
    const t = sc.querySelector('table');
    if (t) ro.observe(t);
  }
  update();
}

/* The /ai page's install configs, one client at a time behind a tab strip. The
   panels ship stacked and visible; everything here is added after render, so a
   reader with no JS — and every crawler, which reads the prerendered file —
   still gets all six with their own headings, notes and code.

   Called from route(), not once at boot: route() reassigns #view-root.innerHTML
   on every navigation, so a strip wired at boot is thrown away the second time
   somebody arrives at /ai. Called after pruneSnippetTabStops() for the same
   reason the capture-phase `toggle` listener above re-runs it: that prune skips
   any pre whose clientWidth is 0, which is exactly what a hidden panel holds, so
   hiding first would strand tabindex="0" and role="group" on five of six
   snippets forever.

   Activation is automatic — an arrow key moves focus and swaps the panel in one
   step — because the panels are prerendered text with nothing to load. No
   transition anywhere in here, so there is no reduced-motion case to answer.

   Every DOM call is typeof-guarded the way setupMatrixFades() guards its own:
   prerender.mjs runs this module in node:vm behind a shim whose getElementById
   returns a truthy fake element, so "if the wrapper is missing, return" never
   fires there. The shim's querySelectorAll returns [], which is what actually
   stops the body below from running, and anything it threw would fail the
   build rather than degrade. */
function setupConfigTabs() {
  const root = document.getElementById('view-root');
  if (!root || typeof root.querySelectorAll !== 'function') return;
  root.querySelectorAll('[data-configs]').forEach(wrap => {
    if (typeof wrap.querySelector !== 'function' || typeof wrap.querySelectorAll !== 'function') return;
    const strip = wrap.querySelector('.tabstrip');
    const panels = Array.prototype.slice.call(wrap.querySelectorAll('.config'));
    if (!strip || panels.length < 2) return;
    /* aria-label because /ai already carries a .jump chip list: two unnamed
       rows of controls on one page is one row too many to tell apart. */
    strip.setAttribute('aria-label', 'Client');
    strip.setAttribute('role', 'tablist');
    strip.innerHTML = panels.map((p, i) => {
      const pid = p.id;
      const label = (p.dataset && p.dataset.configLabel) || '';
      return `<button type="button" role="tab" id="tab-${esc(pid)}" aria-controls="${esc(pid)}"`
        + ` aria-selected="${i === 0}" tabindex="${i === 0 ? 0 : -1}">${esc(label)}</button>`;
    }).join('');
    const tabs = Array.prototype.slice.call(strip.querySelectorAll('[role="tab"]'));
    if (tabs.length !== panels.length) return;
    panels.forEach((p, i) => {
      p.setAttribute('role', 'tabpanel');
      p.setAttribute('aria-labelledby', 'tab-' + p.id);
      if (i) p.setAttribute('hidden', '');
    });
    /* The flag the CSS keys off: it hides each panel's own h3, which the tab
       above now says, and it is scoped so the heading comes back on paper and
       wherever this function never ran. */
    wrap.setAttribute('data-tabs', 'on');
    const select = (i, moveFocus) => {
      tabs.forEach((t, n) => {
        t.setAttribute('aria-selected', String(n === i));
        t.setAttribute('tabindex', n === i ? '0' : '-1');
      });
      panels.forEach((p, n) => {
        if (n === i) p.removeAttribute('hidden');
        else p.setAttribute('hidden', '');
      });
      if (moveFocus && typeof tabs[i].focus === 'function') tabs[i].focus();
    };
    strip.addEventListener('click', e => {
      const t = e.target && typeof e.target.closest === 'function' ? e.target.closest('[role="tab"]') : null;
      const i = tabs.indexOf(t);
      if (i >= 0) select(i, false);
    });
    strip.addEventListener('keydown', e => {
      const last = tabs.length - 1;
      /* Read the selection off the DOM rather than keeping a second copy of it
         in this closure: select() already writes aria-selected, and one of the
         two would eventually be wrong. */
      const at = tabs.findIndex(t => t.getAttribute('aria-selected') === 'true');
      let next = -1;
      if (e.key === 'ArrowRight') next = at === last ? 0 : at + 1;
      else if (e.key === 'ArrowLeft') next = at === 0 ? last : at - 1;
      else if (e.key === 'Home') next = 0;
      else if (e.key === 'End') next = last;
      if (next < 0) return;
      e.preventDefault();
      select(next, true);
    });
  });
}

/* The one thing the page menu needs a script for. Two jobs, both after render,
   both undone by the next route() — which is why this is called from there and
   not once at boot.

   First: the left half of the split ships as a second popover trigger, so a
   reader with no JS opens the menu from either half instead of pressing a
   primary button that cannot do anything. With a script, that half becomes the
   direct copy the label promises, and the chevron keeps the menu.

   Second: aria-expanded. Nothing sets it in the markup on purpose. A button
   with popovertarget already exposes its expanded state, and a hardcoded
   aria-expanded="false" would override that correct value with a stale one for
   every reader who has no JS to keep it honest. So the attribute arrives with
   the script that can maintain it, and toggle fires for every close there is:
   Escape, an outside click, a second press.

   Guarded the way setupConfigTabs() is: prerender.mjs runs this module behind a
   shim whose querySelector hands back a fake element, so "if it is missing,
   return" never fires there and everything below has to be a no-op on a fake. */
function setupPageActions() {
  const root = document.getElementById('view-root');
  if (!root || typeof root.querySelector !== 'function') return;
  const main = root.querySelector('.pa-main');
  const more = root.querySelector('.pa-more');
  const menu = root.querySelector('.pgmenu');
  if (!main || !more || !menu) return;
  /* Only take the fallback away once we know the upgrade can do anything. In a
     context with no clipboard, stripping popovertarget first left a primary half
     that neither copies nor opens the menu. */
  if (navigator.clipboard && typeof main.removeAttribute === 'function')
    main.removeAttribute('popovertarget');
  if (typeof more.setAttribute === 'function') more.setAttribute('aria-expanded', 'false');
  if (typeof menu.addEventListener === 'function') {
    menu.addEventListener('toggle', e => {
      more.setAttribute('aria-expanded', String(e.newState === 'open'));
    });
  }
}

const NAV = [
  ['overview', 'Overview'],
  ['techniques', 'Techniques'], ['platforms', 'Platforms'], ['insights', 'Insights'], ['methodology', 'Methodology'],
  ['reading', 'Reading'], ['ai', 'Ask this study'],
];
/* One glyph per section, drawn in the same 24px stroked style as the theme
   toggle. Feather (MIT), which is where the moon and the sun came from too.
   Kept beside NAV rather than inside it: prerender.mjs destructures NAV as
   [route, label] pairs and counts them against routes.json, and a seven-row
   table stays readable without seven paths threaded through it. */
const NAV_ICON_PATHS = {
  overview: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
  techniques: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
  platforms: '<rect x="2" y="2" width="20" height="8" rx="2"/><rect x="2" y="14" width="20" height="8" rx="2"/><line x1="6" y1="6" x2="6.01" y2="6"/><line x1="6" y1="18" x2="6.01" y2="18"/>',
  insights: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
  methodology: '<path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1"/>',
  reading: '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
  ai: '<polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/>',
};
/* aria-hidden because the label beside it already says the same thing; an
   announced icon would only make every link read its name twice. */
const navIcon = (r) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${NAV_ICON_PATHS[r]}</svg>`;
/* A table rather than an `r === 'ai'` test, so a second badged route is a row
   here and not a second branch. Hidden from the reader for the reason the
   glyphs are: the link already names a destination that answers as a model, and
   two spelled-out letters trailing the name would be the only nav item that
   does not read as a plain noun phrase. */
const NAV_TAG = { ai: 'AI' };
const navTag = (r) => NAV_TAG[r] ? `<span class="navtag" aria-hidden="true">${NAV_TAG[r]}</span>` : '';
/* Platform marks, keyed by platform id the way NAV_ICON_PATHS is keyed by route,
   but resolved by the build rather than typed here: three come out of the
   simple-icons package and three out of assets/logos/, and build_dashboard.py
   refuses to finish if any of the six cannot be read.
   Not folded into navIcon, because the two draw in opposite paint models. The
   nav glyphs are stroked outlines that need fill="none"; these are solid, and
   fill="none" would render them as nothing at all.
   An id with no geometry returns nothing, so its heading renders exactly as it
   did before rather than carrying an empty <svg>. That is 'other', which the
   system schema permits and most system records use — the common path on a
   system page, not an edge case. It cannot happen on /platforms, which iterates
   the records themselves. */
const LOGO_PATHS = DATA.logos || {};
const logoIcon = id => LOGO_PATHS[id]
  ? `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${LOGO_PATHS[id]}</svg>`
  : '';
/* Full page titles, from the same build-time table the prerendered <title> tags
   and the sitemap come from, so an in-page navigation to /techniques leaves the
   tab reading what a crawler sees rather than the one-word nav label. */
const VIEW_TITLES = (DATA.meta && DATA.meta.view_titles) || {};
const NAV_LABEL = {};
NAV.forEach(([r, l]) => { NAV_LABEL[r] = l; });
/* The icon goes inside the anchor and the attributes stay exactly as they were:
   prerender.mjs marks the current page by matching this opening tag, so its
   href and data-r are load-bearing in a second file. */
$('#nav').innerHTML = NAV.map(([r, l]) => `<a href="${r === 'overview' ? href() : href(r)}" data-r="${r}">${navIcon(r)}<span>${l}</span>${navTag(r)}</a>`).join('');
/* The masthead ships as href="/" so the prerendered HTML is right without JS.
   Under hash routing that address is not a route, so point it at the real one. */
$('#brand').setAttribute('href', href());
/* The provenance clause is per view: every page is fixed at the collection
   window except the reading list, and a page carrying both dates tells the
   reader to pick one. */
function footHTML(view) {
  const when = view === 'reading'
    ? `Reading list updated ${esc(longDate(DATA.meta.reading_updated))}`
    : 'Data gathered 26–28 July 2026';
  return `A field study by <a href="https://www.kaelig.fr">Kaelig Deloumeau-Prigent</a> · ${when} · <a href="${href('methodology')}">Methodology</a> · <a href="${REPO_URL}" target="_blank" rel="noopener">Source${NEWTAB}</a> · <a href="${REPO_URL}/issues/new/choose" target="_blank" rel="noopener">Feedback${NEWTAB}</a>`;
}
$('#foot').innerHTML = footHTML(parse().view);

function route(opts) {
  const { view, arg } = parse();
  route.current = view;
  const fn = VIEWS[view] || VIEWS.overview;
  $('#view-root').innerHTML = `<div class="view on">${fn(arg)}</div>`;

  let full = VIEW_TITLES[view] || '';
  if (view === 'system') {
    const s = DATA.systems.find(x => x.id === arg);
    full = `${s ? s.name : 'Not found'} · ${SITE_TITLE}`;
  } else if (!full) {
    const label = NAV_LABEL[view] || '';
    full = label ? `${label} · ${SITE_TITLE}` : BASE_TITLE;
  }
  document.title = full;
  $('#foot').innerHTML = footHTML(view);

  /* A system record is a leaf of the overview now that the matrix lives there. */
  const navActive = view === 'system' ? 'overview' : (VIEWS[view] ? view : 'overview');
  document.querySelectorAll('#nav a').forEach(a => {
    const active = a.dataset.r === navActive;
    a.classList.toggle('on', active);
    if (active) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  /* On narrow screens the nav is one scrollable row, so the current section can
     sit past the right edge. Scroll the row, never the document. */
  const nav = $('#nav'), here = $('#nav a[aria-current]');
  if (nav && here && nav.scrollWidth > nav.clientWidth) {
    nav.scrollLeft = Math.max(0, here.offsetLeft - 12);
  }

  if (fn === VIEWS.overview) setupMatrixFades();
  setupPageActions();
  pruneSnippetTabStops();
  /* After the prune, never before it: the prune measures, and a hidden panel
     measures 0 and gets skipped. See setupConfigTabs()'s own note. */
  if (fn === VIEWS.ai) setupConfigTabs();
  window.scrollTo(0, 0);
  if (opts && opts.focus) {
    const main = document.getElementById('main');
    if (main) main.focus({ preventScroll: true });
  }
}

if (ROUTING === 'path') {
  if (/^#\//.test(location.hash)) {
    const p = location.hash.replace(/^#\/?/, '').replace(/\/+$/, '');
    const seg = p.split('/');
    let target = '/';
    if (seg[0] === 'system' && seg[1]) target = '/systems/' + seg[1];
    else if (p && seg[0] !== 'overview') target = '/' + p;
    history.replaceState(null, '', target);
  }
  document.addEventListener('click', e => {
    if (e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
    const a = e.target.closest('a');
    if (!a || a.hasAttribute('target') || a.hasAttribute('download')) return;
    if (a.origin !== location.origin) return;
    const raw = a.getAttribute('href');
    if (!raw || raw[0] !== '/') return;
    /* A path with a file extension is a real file (the .md / .json record
       mirrors, the data downloads), not a route. Let the browser fetch it. */
    if (/\.[a-z0-9]{1,8}$/i.test(a.pathname)) return;
    e.preventDefault();
    if (a.pathname !== location.pathname) history.pushState(null, '', a.pathname);
    route({ focus: true });
  });
  window.addEventListener('popstate', () => route({ focus: true }));
} else {
  /* Only "#/"-prefixed hashes are routes. A plain "#systems" is an in-page
     anchor (the stat tiles use one); re-rendering on it would scroll the reader
     back to the top of the view they were trying to move within. The one time a
     plain anchor still routes is when back/forward lands it on a different view
     than the one on screen — the anchor's scroll is lost, but the page is right. */
  window.addEventListener('hashchange', () => {
    if (/^#\//.test(location.hash) || parse().view !== route.current) route({ focus: true });
  });
}

/* The announcement lives in one document-level status region, not on 300+
   buttons. Cleared after the visible swap so a second copy re-announces. */
let statusTimer = null;
function say(msg) {
  const n = document.getElementById('copy-status');
  if (!n) return;
  n.textContent = msg;
  if (statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { n.textContent = ''; }, 2000);
}
/* Swap a control's own label for the outcome, then put it back. The snippet
   buttons name themselves in .btxt and the page menu in .pgt; the original word
   is parked on the element rather than retyped here, so a row whose title
   changes keeps announcing itself correctly. */
/* One page-wide flag, not one per button: see the note at the press site. */
let pageCopyBusy = false;
function copySaid(b, word, msg, ms) {
  /* route() replaces #view-root wholesale on every navigation, but #copy-status
     lives outside it and survives. Without this, a copy still in flight when the
     reader clicks away resolves against a detached button and announces about a
     page they have left. One check covers all three copy paths. */
  if (b.isConnected === false) return;
  const l = b.querySelector('.btxt') || b.querySelector('.pgt') || b;
  if (!b.dataset.paLabel) b.dataset.paLabel = l.textContent;
  /* One timer per control. The page copy announces twice — the attempt, then
     the outcome — and without this the first restore lands in the middle of the
     second word and reads as a flicker. */
  if (b.paTimer) clearTimeout(b.paTimer);
  l.textContent = word;
  say(msg);
  /* ms of 0 means hold the word until something replaces it. The pending state
     uses that: restoring "Copy page" on a timer while the fetch is still open
     left a button that looks ready and silently swallows the press. */
  if (ms) b.paTimer = setTimeout(() => { l.textContent = b.dataset.paLabel; }, ms);
}
/* Every copy on the site arrives here. Three of them now: a snippet by id, the
   MCP install command as literal text, and the page itself, which is the one
   that has to be fetched first.
   navigator.clipboard is tested here and never in a view function — the
   prerender sandbox sets it to null, so a renderer-side test would ship the
   rows missing from all 27 files and shift the page on first paint. fetch()
   likewise stays inside the handler: the sandbox has none, and a call at module
   scope would fail the build. */
document.addEventListener('click', e => {
  const b = e.target.closest('button[data-copy], button[data-copy-text], button[data-page-md]');
  if (!b) return;
  const clip = navigator.clipboard;
  if (!clip) { say("This browser will not let the page copy for you"); return; }
  if (b.dataset.copy !== undefined) {
    const pre = document.getElementById('sn-' + b.dataset.copy);
    if (pre) clip.writeText(pre.textContent)
      .then(() => copySaid(b, 'copied', 'Copied to clipboard', 1200))
      .catch(() => copySaid(b, "couldn't copy", "Couldn't copy", 1500));
    return;
  }
  if (b.dataset.copyText !== undefined) {
    clip.writeText(b.dataset.copyText).then(
      () => copySaid(b, 'Copied', 'Install command copied to clipboard', 1600),
      () => copySaid(b, "Couldn't copy", "Couldn't copy the command", 2000));
    return;
  }
  /* Copying the page is the one action here that has to go and get something
     first, so it is the one with a pending state: the button is marked busy,
     repeat presses are dropped while the request is open, and the attempt is
     announced before the outcome so a screen reader is not left in silence.
     A failure names the download row, which needs no clipboard and no network
     of its own. */
  /* Two buttons carry data-page-md on every route — the split control and the
     menu row — so the in-flight flag lives on the page, not on the element that
     was pressed. Per-element, the two of them raced: two fetches, two clipboard
     writes, last one wins. */
  if (pageCopyBusy) return;
  pageCopyBusy = true;
  b.setAttribute('aria-busy', 'true');
  const done = () => { pageCopyBusy = false; b.removeAttribute('aria-busy'); };
  /* No timeout means a hung request holds the button busy for the life of the
     page with nothing to press and nothing to read. */
  const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
  const bail = ctrl ? setTimeout(() => ctrl.abort(), 10000) : 0;
  copySaid(b, 'Copying…', 'Copying this page', 0);
  fetch(b.dataset.pageMd, { headers: { Accept: 'text/markdown' }, signal: ctrl && ctrl.signal })
    .then(r => {
      /* An error page served as 200 HTML would otherwise be copied and announced
         as a success, which is worse than failing. */
      const type = r.headers && r.headers.get && r.headers.get('content-type');
      if (!r.ok) throw new Error(String(r.status));
      if (type && !/^text\/(markdown|plain)/.test(type)) throw new Error('not markdown');
      return r.text();
    })
    /* The same clause the open-in links carry. This page quotes instruction
       files verbatim from other people's repositories, and the clipboard is
       headed for an assistant just as surely as the ?q= links are. Prepended to
       what is copied, never to the .md itself, which the MCP server and the
       mirrors serve byte-for-byte. */
    .then(t => clip.writeText(ASK_QUOTE_NOTE + '\n\n' + t))
    .then(() => { clearTimeout(bail); done(); copySaid(b, 'Copied', 'Page copied to clipboard', 1600); })
    .catch(() => { clearTimeout(bail); done(); copySaid(b, "Couldn't copy", "Couldn't copy the page. Download as md instead.", 2500); });
});

/* Platform jump links. preventDefault keeps the hash-routed artifact from
   treating "#figma" as a route, and moving focus means the keyboard follows. */
document.addEventListener('click', e => {
  const a = e.target.closest('a[data-jump]');
  if (!a || e.defaultPrevented || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey) return;
  const target = document.getElementById(a.dataset.jump);
  if (!target) return;
  e.preventDefault();
  target.scrollIntoView({ block: 'start' });
  target.focus({ preventScroll: true });
});

function syncToggle(isDark) {
  const t = $('#theme-toggle');
  if (t) t.setAttribute('aria-pressed', String(!!isDark));
}
function darkNow() {
  const cur = document.documentElement.getAttribute('data-theme');
  return cur ? cur === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
}
$('#theme-toggle').addEventListener('click', () => {
  const next = darkNow() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  syncToggle(next === 'dark');
  try { localStorage.setItem('theme', next); } catch (e) {}
});
syncToggle(darkNow());

/* Expand every collapsed section for printing, then put it back. */
let printRestore = [];
window.addEventListener('beforeprint', () => {
  printRestore = [];
  document.querySelectorAll('details').forEach(d => {
    printRestore.push([d, d.open]);
    d.open = true;
  });
});
window.addEventListener('afterprint', () => {
  printRestore.forEach(([d, was]) => { d.open = was; });
  printRestore = [];
});

/* ---------- WebMCP ----------
   Registers the same four read-only tools the /mcp server exposes, as page tools
   an in-browser agent can call instead of scraping the DOM. document.modelContext
   is a W3C community-group draft (21 July 2026 editor's draft); today it exists
   only in Chrome behind a flag or the 149–156 origin trial, so on every other
   browser the guard below returns and nothing else in here runs. Kept isolated on
   purpose: if the spec renames the entry point again, this is a one-line fix. */
function registerReportTools(DATA) {
  const mc = typeof document !== 'undefined' && document.modelContext;
  if (!mc || typeof mc.registerTool !== 'function') return null;

  const uniq = xs => Array.from(new Set(xs.filter(Boolean))).sort();
  const systems = DATA.systems || [];
  const IDS = systems.map(s => s.id);
  const MATURITY = uniq(systems.map(s => s.ai_maturity));
  const CATEGORY = uniq(systems.map(s => s.category));
  const AFF_TYPE = uniq(systems.flatMap(s => (s.affordances || []).map(a => a.type)));
  const TECH_CAT = uniq(systems.flatMap(s => (s.techniques || []).map(t => t.category)));
  const SNAPSHOT = 'Snapshot of 26–28 July 2026. Cite the source_url on each record, not this page.';

  /* The dataset quotes instruction files from third-party repositories, so tool
     output is other people's text: read-only, and flagged as untrusted content. */
  const annotations = { readOnlyHint: true, untrustedContentHint: true };
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const line = s => ({
    id: s.id, name: s.name, org: s.org, category: s.category, ai_maturity: s.ai_maturity,
    docs_url: s.docs_url, repo_url: s.repo_url, summary: s.summary,
    affordance_types: uniq((s.affordances || []).filter(a => a.present !== false).map(a => a.type)),
    counts: { affordances: (s.affordances || []).length, techniques: (s.techniques || []).length },
  });
  const out = v => JSON.stringify({ source: 'State of AI in Design Systems, July 2026', note: SNAPSHOT, ...v });

  const TOOLS = [
    {
      name: 'list_systems',
      title: 'List design systems',
      description: `List the ${systems.length} design systems surveyed in this report, one compact record each: `
        + 'id, org, category, AI maturity, links, which affordance types it ships, and a one-line summary. '
        + 'Filter first, then call get_system for the full record. ' + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, properties: {
          maturity: { type: 'string', enum: MATURITY, description: 'How far the system has gone on AI consumption.' },
          category: { type: 'string', enum: CATEGORY },
          has_affordance: { type: 'string', enum: AFF_TYPE, description: 'Only systems shipping at least one affordance of this type.' },
        },
      },
      execute: async (input) => {
        const a = input || {};
        let rows = systems;
        if (a.maturity) rows = rows.filter(s => s.ai_maturity === a.maturity);
        if (a.category) rows = rows.filter(s => s.category === a.category);
        if (a.has_affordance) rows = rows.filter(s => (s.affordances || []).some(x => x.type === a.has_affordance && x.present !== false));
        return out({ total: rows.length, of: systems.length, systems: rows.map(line) });
      },
    },
    {
      name: 'get_system',
      title: 'Get one design system',
      description: 'The full record for one surveyed design system: summary, every AI affordance, every '
        + 'model-coercion technique with the snippet it was quoted from, platform integrations, gaps and sources. '
        + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, required: ['id'],
        properties: { id: { type: 'string', enum: IDS, description: 'System id, as returned by list_systems.' } },
      },
      execute: async (input) => {
        const s = systems.find(x => x.id === (input || {}).id);
        if (!s) return out({ error: 'No system with that id.', valid_ids: IDS });
        return out({ system: s, page: location.origin + '/systems/' + s.id });
      },
    },
    {
      name: 'search',
      title: 'Search the survey',
      description: 'Full-text search across system summaries, affordances, coercion techniques and the quoted '
        + 'snippets. Words are ANDed. Returns short excerpts with the source URL for each hit. ' + SNAPSHOT,
      inputSchema: {
        type: 'object', additionalProperties: false, required: ['query'],
        properties: {
          query: { type: 'string', maxLength: 120, description: 'Words to look for, e.g. "code connect".' },
          kind: { type: 'string', enum: ['all', 'system', 'affordance', 'technique'] },
          limit: { type: 'integer', minimum: 1, maximum: 25, description: 'Default 10.' },
        },
      },
      execute: async (input) => {
        const a = input || {};
        const words = String(a.query || '').toLowerCase().split(/\s+/).filter(Boolean).slice(0, 8);
        if (!words.length) return out({ error: 'Empty query.' });
        const kind = a.kind || 'all';
        const limit = Math.min(Math.max(parseInt(a.limit, 10) || 10, 1), 25);
        const hits = [];
        for (const s of systems) {
          const push = (k, name, text, url) => {
            if (hits.length >= limit) return;
            const hay = (name + ' ' + text).toLowerCase();
            if (words.every(w => hay.includes(w))) {
              hits.push({ kind: k, system: s.name, system_id: s.id, name, excerpt: String(text).slice(0, 300), source_url: url || null });
            }
          };
          if (kind === 'all' || kind === 'system') push('system', s.name, s.summary || '', s.docs_url);
          if (kind === 'all' || kind === 'affordance') {
            for (const x of s.affordances || []) push('affordance', x.name, [x.description, x.snippet && x.snippet.content].filter(Boolean).join(' '), (x.snippet && x.snippet.source_url) || x.docs_url || x.code_url);
          }
          if (kind === 'all' || kind === 'technique') {
            for (const t of s.techniques || []) push('technique', t.name, [t.description, t.snippet && t.snippet.content].filter(Boolean).join(' '), t.snippet && t.snippet.source_url);
          }
        }
        return out({ query: words.join(' '), returned: hits.length, limit, hits });
      },
    },
    {
      name: 'get_stats',
      title: 'Report totals and filter vocabulary',
      description: 'Headline counts for the report plus the exact enum values the other tools accept as filters. '
        + 'Call this first if you are unsure what to ask for. ' + SNAPSHOT,
      inputSchema: { type: 'object', additionalProperties: false, properties: {} },
      execute: async () => out({
        counts: DATA.meta.counts,
        enums: { ai_maturity: MATURITY, category: CATEGORY, affordance_type: AFF_TYPE, technique_category: TECH_CAT, system_id: IDS },
        methodology: location.origin + '/methodology.md',
      }),
    },
  ];

  const registered = [];
  for (const t of TOOLS) {
    try {
      mc.registerTool({ ...t, annotations }, ctl ? { signal: ctl.signal } : {});
      registered.push(t.name);
    } catch (e) { /* a spec change must not break the page */ }
  }
  return { tools: registered, unregister: () => ctl && ctl.abort() };
}
try { registerReportTools(DATA); } catch (e) { /* never let page tools break the report */ }

route();
</script>
