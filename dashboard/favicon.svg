<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="State of AI in Design Systems">
  <!-- The affordance matrix in miniature: filled dots, one ring, on the slate
       data wash. Site colors: mat-2 ground and ink, per theme. -->
  <style>
    .g { fill: oklch(88.6% 0.028 244.7); } .d { fill: oklch(38.3% 0.055 245.9); } .r { fill: none; stroke: oklch(38.3% 0.055 245.9); stroke-width: 1.8; }
    @media (prefers-color-scheme: dark) {
      .g { fill: oklch(33.8% 0.041 250.4); } .d { fill: oklch(85.3% 0.037 244.5); } .r { stroke: oklch(85.3% 0.037 244.5); }
    }
  </style>
  <rect class="g" width="32" height="32" rx="4"/>
  <circle class="d" cx="8" cy="8" r="2.9"/>
  <circle class="d" cx="16" cy="8" r="2.9"/>
  <circle class="r" cx="24" cy="8" r="2.4"/>
  <circle class="d" cx="8" cy="16" r="2.9"/>
  <circle class="d" cx="16" cy="16" r="2.9"/>
  <circle class="d" cx="24" cy="16" r="2.9"/>
  <circle class="d" cx="8" cy="24" r="2.9"/>
  <circle class="r" cx="16" cy="24" r="2.4"/>
  <circle class="d" cx="24" cy="24" r="2.9"/>
</svg>
